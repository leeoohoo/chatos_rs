[package]
name = "chatos_agent_profiles"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chatos_ai_runtime = { path = "../chatos_ai_runtime" }
chatos_local_agent_protocol = { path = "../chatos_local_agent_protocol" }
chatos_local_agent_runtime = { path = "../chatos_local_agent_runtime" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
