<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ChatOS Chrome</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { width: 320px; margin: 0; padding: 16px; background: #111318; color: #f5f7fb; }
      h1 { margin: 0 0 6px; font-size: 17px; }
      p { margin: 0 0 12px; color: #aeb7c7; font-size: 12px; line-height: 1.5; }
      .card { border: 1px solid #303746; border-radius: 10px; padding: 12px; background: #181c24; }
      .site { overflow-wrap: anywhere; font-size: 12px; color: #dce3ee; }
      .status { margin-top: 8px; font-size: 12px; color: #aeb7c7; }
      .status.ready { color: #77d69a; }
      .status.warn { color: #f4bd67; }
      .actions { display: grid; gap: 8px; margin-top: 12px; }
      button { border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; font-weight: 600; }
      button.primary { background: #5f7cff; color: #fff; }
      button.secondary { background: #2a303d; color: #e9edf5; }
      button.danger { background: #43252a; color: #ffb8c0; }
      button:disabled { cursor: default; opacity: .45; }
      .notice { margin-top: 12px; font-size: 11px; color: #8f99aa; line-height: 1.45; }
    </style>
  </head>
  <body>
    <h1>ChatOS Chrome</h1>
    <p>只连接你明确授权的当前站点和标签页。</p>
    <div class="card">
      <div id="site" class="site">正在读取当前标签页…</div>
      <div id="hostStatus" class="status"></div>
      <div id="siteStatus" class="status"></div>
      <div class="actions">
        <button id="grant" class="primary">授权站点并连接标签页</button>
        <button id="release" class="secondary">断开当前标签页</button>
        <button id="revoke" class="danger">撤销当前站点权限</button>
      </div>
    </div>
    <div class="notice">
      扩展不申请 Cookie、历史记录、下载或书签权限。ChatOS 读取已登录页面内容时仍需 Local Connector 本机逐次批准。
    </div>
    <script src="popup.js"></script>
  </body>
</html>
