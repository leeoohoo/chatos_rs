[package]
name = "chatos_local_agent_host"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
chatos_agent_profiles = { path = "../chatos_agent_profiles" }
chatos_client_storage = { path = "../chatos_client_storage" }
chatos_memory_client = { path = "../chatos_memory_client" }
chatos_local_agent_protocol = { path = "../chatos_local_agent_protocol" }
chatos_local_agent_runtime = { path = "../chatos_local_agent_runtime" }
chatos_mcp_runtime = { path = "../../../../crates/chatos_mcp_runtime" }
chatos_plugin_management_sdk = { path = "../../../../crates/chatos_plugin_management_sdk" }
parking_lot = "0.12"
chrono = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = "0.7"
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
async-trait = "0.1"
ring = "0.17"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
