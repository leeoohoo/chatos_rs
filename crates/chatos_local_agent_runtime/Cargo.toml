[package]
name = "chatos_local_agent_runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chatos_client_storage = { path = "../chatos_client_storage" }
chatos_local_agent_protocol = { path = "../chatos_local_agent_protocol" }
chatos_service_runtime = { path = "../chatos_service_runtime" }
chrono = "0.4"
futures-util = "0.3"
memory_engine_sdk = { path = "../memory_engine_sdk" }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "time"] }
tokio-util = "0.7"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
