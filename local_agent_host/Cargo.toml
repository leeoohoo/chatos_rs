[package]
name = "chatos_local_agent_host"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chatos_client_storage = { path = "../crates/chatos_client_storage" }
chatos_local_agent_protocol = { path = "../crates/chatos_local_agent_protocol" }
chatos_local_agent_runtime = { path = "../crates/chatos_local_agent_runtime" }
chrono = "0.4"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
