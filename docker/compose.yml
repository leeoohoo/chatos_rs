  - source: config_center_mtls_local_connector_identity
    target: config_center_mtls_client_identity
  - source: plugin_management_mtls_ca
    target: plugin_management_mtls_ca
  - source: plugin_management_mtls_local_connector_identity
    target: plugin_management_mtls_client_identity
  - source: local_connector_mtls_ca
    target: local_connector_mtls_ca
  - source: local_connector_mtls_server_cert
    target: local_connector_mtls_server_cert
  - source: local_connector_mtls_server_key
    target: local_connector_mtls_server_key

x-config-center-mtls-memory-engine-secrets: &config-center-mtls-memory-engine-secrets
  - source: config_center_mtls_ca
    target: config_center_mtls_ca
  - source: config_center_mtls_memory_engine_identity
    target: config_center_mtls_client_identity
  - source: plugin_management_mtls_ca
    target: plugin_management_mtls_ca
  - source: plugin_management_mtls_memory_engine_identity
    target: plugin_management_mtls_client_identity
  - source: user_service_mtls_ca
    target: user_service_mtls_ca
  - source: user_service_mtls_memory_engine_identity
    target: user_service_mtls_client_identity

x-config-center-mtls-memory-engine-api-secrets: &config-center-mtls-memory-engine-api-secrets
  - source: config_center_mtls_ca
    target: config_center_mtls_ca
  - source: config_center_mtls_memory_engine_identity
    target: config_center_mtls_client_identity
  - source: memory_engine_mtls_ca
    target: memory_engine_mtls_ca
  - source: memory_engine_mtls_server_cert
    target: memory_engine_mtls_server_cert
  - source: memory_engine_mtls_server_key
    target: memory_engine_mtls_server_key
  - source: plugin_management_mtls_ca
    target: plugin_management_mtls_ca
  - source: plugin_management_mtls_memory_engine_identity
    target: plugin_management_mtls_client_identity
  - source: user_service_mtls_ca
    target: user_service_mtls_ca
  - source: user_service_mtls_memory_engine_identity
    target: user_service_mtls_client_identity

x-config-center-mtls-official-website-secrets: &config-center-mtls-official-website-secrets
  - source: config_center_mtls_ca
    target: config_center_mtls_ca
  - source: config_center_mtls_official_website_identity
    target: config_center_mtls_client_identity

x-config-center-mtls-plugin-management-secrets: &config-center-mtls-plugin-management-secrets
  - source: config_center_mtls_ca
    target: config_center_mtls_ca
  - source: config_center_mtls_plugin_management_identity
    target: config_center_mtls_client_identity
  - source: plugin_management_mtls_ca
    target: plugin_management_mtls_ca
  - source: plugin_management_mtls_server_cert
    target: plugin_management_mtls_server_cert
  - source: plugin_management_mtls_server_key
    target: plugin_management_mtls_server_key

x-config-center-mtls-user-service-secrets: &config-center-mtls-user-service-secrets
  - source: config_center_mtls_ca
    target: config_center_mtls_ca
  - source: config_center_mtls_user_service_identity
    target: config_center_mtls_client_identity
  - source: user_service_mtls_ca
    target: user_service_mtls_ca
  - source: user_service_mtls_server_cert
    target: user_service_mtls_server_cert
  - source: user_service_mtls_server_key
    target: user_service_mtls_server_key

x-rust-service: &rust-service
  restart: unless-stopped
  deploy: *rust-deploy
  depends_on:
    consul:
      condition: service_healthy
    postgres:
      condition: service_healthy
    configuration-center-backend:
      condition: service_healthy
  networks:
    - cloud

x-service-runtime-env: &service-runtime-env
  CHATOS_SERVICE_RUNTIME_ENABLED: ${CHATOS_SERVICE_RUNTIME_ENABLED:-true}
  CHATOS_SERVICE_DISCOVERY_MODE: ${CHATOS_SERVICE_DISCOVERY_MODE:-consul,static}
  CHATOS_ENV: ${CHATOS_ENV:-local}
  CHATOS_CONSUL_HTTP_ADDR: ${CHATOS_CONSUL_HTTP_ADDR:-http://consul:8500}
  CHATOS_SERVICE_RUNTIME_REQUEST_TIMEOUT_MS: ${CHATOS_SERVICE_RUNTIME_REQUEST_TIMEOUT_MS:-3000}
  CONFIG_CENTER_BASE_URL: https://configuration-center-backend:39272
  CONFIG_CENTER_MTLS_CA_CERT_PATH: /run/secrets/config_center_mtls_ca
  PLUGIN_MANAGEMENT_MTLS_CA_CERT_PATH: /run/secrets/plugin_management_mtls_ca
  PLUGIN_MANAGEMENT_MTLS_CLIENT_IDENTITY_PATH: /run/secrets/plugin_management_mtls_client_identity
  CONFIG_CENTER_MTLS_CLIENT_IDENTITY_PATH: /run/secrets/config_center_mtls_client_identity
  CONFIG_CENTER_REQUEST_TIMEOUT_MS: ${CONFIG_CENTER_REQUEST_TIMEOUT_MS:-3000}
  CHATOS_AI_CONNECT_TIMEOUT_SECS: ${CHATOS_AI_CONNECT_TIMEOUT_SECS:-15}
  CHATOS_AI_READ_TIMEOUT_SECS: ${CHATOS_AI_READ_TIMEOUT_SECS:-7200}

x-frontend-service: &frontend-service
  restart: unless-stopped
  deploy: *frontend-deploy
  networks:
    - cloud

x-postgres-migration: &postgres-migration
  restart: "no"
  entrypoint: ["/usr/local/bin/chatos-migrate"]
  depends_on:
    postgres-provision:
      condition: service_completed_successfully
  networks:
    - cloud

services:
  consul:
    image: ${CONSUL_IMAGE:-hashicorp/consul:1.21}
    restart: unless-stopped
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui", "-data-dir=/tmp/consul-data"]
    ports:
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${CONSUL_HTTP_PORT:-8500}:8500"
    volumes:
      - ./consul/services/harness.json:/consul/config/harness.json:ro
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "${CONSUL_CPU_LIMIT:-1.0}"
          memory: ${CONSUL_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${CONSUL_CPU_RESERVATION:-0.10}"
          memory: ${CONSUL_MEMORY_RESERVATION:-128M}
    networks:
      - cloud

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_SERVER_MAX_CONNECTIONS:-200}
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-chatos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
      TZ: UTC
    ports:
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ keeps the cluster in a major-version subdirectory.
      # Mount the parent directory so the image can manage that layout and
      # future pg_upgrade operations do not cross a volume boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
          memory: ${POSTGRES_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${POSTGRES_CPU_RESERVATION:-0.25}"
          memory: ${POSTGRES_MEMORY_RESERVATION:-512M}
    networks:
      - cloud

  postgres-provision:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    restart: "no"
    entrypoint: ["/bin/bash", "/scripts/postgres-provision-local.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_ADMIN_DATABASE: postgres
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-chatos_admin}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}
      CONFIG_CENTER_APP_PASSWORD: ${CONFIG_CENTER_APP_PASSWORD:-${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}}
      USER_SERVICE_APP_PASSWORD: ${USER_SERVICE_APP_PASSWORD:-${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}}
      PLUGIN_MANAGEMENT_APP_PASSWORD: ${PLUGIN_MANAGEMENT_APP_PASSWORD:-${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}}
      LOCAL_CONNECTOR_APP_PASSWORD: ${LOCAL_CONNECTOR_APP_PASSWORD:-${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}}
      MEMORY_ENGINE_APP_PASSWORD: ${MEMORY_ENGINE_APP_PASSWORD:-${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}}
      CONFIG_CENTER_MIGRATOR_PASSWORD: ${CONFIG_CENTER_MIGRATOR_PASSWORD:-${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}}
      USER_SERVICE_MIGRATOR_PASSWORD: ${USER_SERVICE_MIGRATOR_PASSWORD:-${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}}
      PLUGIN_MANAGEMENT_MIGRATOR_PASSWORD: ${PLUGIN_MANAGEMENT_MIGRATOR_PASSWORD:-${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}}
      LOCAL_CONNECTOR_MIGRATOR_PASSWORD: ${LOCAL_CONNECTOR_MIGRATOR_PASSWORD:-${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}}
      MEMORY_ENGINE_MIGRATOR_PASSWORD: ${MEMORY_ENGINE_MIGRATOR_PASSWORD:-${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}}
    volumes:
      - ../scripts/postgres-provision-local.sh:/scripts/postgres-provision-local.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloud

  configuration-center-migrate:
    <<: *postgres-migration
    image: ${CONFIG_CENTER_BACKEND_IMAGE:-${CHATOS_IMAGE_NAMESPACE:-ghcr.io/leeoohoo}/chatos-rs-configuration-center-backend:${CHATOS_IMAGE_TAG:-latest}}
    environment:
      CONFIG_CENTER_MIGRATION_DATABASE_URL: postgresql://config_center_migrator:${CONFIG_CENTER_MIGRATOR_PASSWORD:-${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}}@postgres:5432/configuration_center

  user-service-migrate:
    <<: *postgres-migration
    image: ${USER_SERVICE_BACKEND_IMAGE:-${CHATOS_IMAGE_NAMESPACE:-ghcr.io/leeoohoo}/chatos-rs-user-service-backend:${CHATOS_IMAGE_TAG:-latest}}
    environment:
      USER_SERVICE_MIGRATION_DATABASE_URL: postgresql://user_service_migrator:${USER_SERVICE_MIGRATOR_PASSWORD:-${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}}@postgres:5432/user_service

  plugin-management-migrate:
    <<: *postgres-migration
    image: ${PLUGIN_MANAGEMENT_BACKEND_IMAGE:-${CHATOS_IMAGE_NAMESPACE:-ghcr.io/leeoohoo}/chatos-rs-plugin-management-backend:${CHATOS_IMAGE_TAG:-latest}}
    environment:
      PLUGIN_MANAGEMENT_MIGRATION_DATABASE_URL: postgresql://plugin_management_migrator:${PLUGIN_MANAGEMENT_MIGRATOR_PASSWORD:-${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}}@postgres:5432/plugin_management_service

  local-connector-migrate:
    <<: *postgres-migration
    image: ${LOCAL_CONNECTOR_SERVICE_BACKEND_IMAGE:-${CHATOS_IMAGE_NAMESPACE:-ghcr.io/leeoohoo}/chatos-rs-local-connector-service-backend:${CHATOS_IMAGE_TAG:-latest}}
    environment:
      LOCAL_CONNECTOR_MIGRATION_DATABASE_URL: postgresql://local_connector_migrator:${LOCAL_CONNECTOR_MIGRATOR_PASSWORD:-${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}}@postgres:5432/local_connector_service

  memory-engine-migrate:
    <<: *postgres-migration
    image: ${MEMORY_ENGINE_BACKEND_IMAGE:-${CHATOS_IMAGE_NAMESPACE:-ghcr.io/leeoohoo}/chatos-rs-memory-engine-backend:${CHATOS_IMAGE_TAG:-latest}}
    environment:
      MEMORY_ENGINE_MIGRATION_DATABASE_URL: postgresql://memory_engine_migrator:${MEMORY_ENGINE_MIGRATOR_PASSWORD:-${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}}@postgres:5432/memory_engine

  postgres-finalize:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    restart: "no"
    entrypoint: ["/bin/bash", "/scripts/postgres-finalize-privileges.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-chatos_admin}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
    volumes:
      - ../scripts/postgres-finalize-privileges.sh:/scripts/postgres-finalize-privileges.sh:ro
    depends_on:
      configuration-center-migrate:
        condition: service_completed_successfully
      user-service-migrate:
        condition: service_completed_successfully
      plugin-management-migrate:
        condition: service_completed_successfully
      local-connector-migrate:
        condition: service_completed_successfully
      memory-engine-migrate:
        condition: service_completed_successfully
    networks:
      - cloud

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        minio server /data --console-address :9001 &
        server_pid=$$!
        trap 'kill -TERM "$$server_pid" 2>/dev/null || true; wait "$$server_pid"' TERM INT
        until mc alias set local http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
          sleep 1
        done
        mc mb --ignore-existing "local/$${CHATOS_OBJECT_STORAGE_BUCKET}" >/dev/null
        wait "$$server_pid"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chatos_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chatos_local_secret_change_me}
      CHATOS_OBJECT_STORAGE_BUCKET: ${CHATOS_OBJECT_STORAGE_BUCKET:-chatos-attachments}
    ports:
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-39000}:9000"
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-39001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "${MINIO_CPU_LIMIT:-1.0}"
          memory: ${MINIO_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${MINIO_CPU_RESERVATION:-0.05}"
          memory: ${MINIO_MEMORY_RESERVATION:-128M}
    networks:
      - cloud

  configuration-center-backend:
    restart: unless-stopped
    deploy: *rust-deploy
    image: ${CONFIG_CENTER_BACKEND_IMAGE:-${CHATOS_IMAGE_NAMESPACE:-ghcr.io/leeoohoo}/chatos-rs-configuration-center-backend:${CHATOS_IMAGE_TAG:-latest}}
    secrets: *config-center-mtls-server-secrets
    environment:
      <<: *service-runtime-env
      CHATOS_SERVICE_NAME: configuration-center
      CHATOS_SERVICE_ID: configuration-center-docker
      CHATOS_SERVICE_ADDRESS: configuration-center-backend
      CHATOS_SERVICE_PORT: 39270
      CHATOS_SERVICE_HEALTH_PATH: /health
      CONFIG_CENTER_HOST: 0.0.0.0
      CONFIG_CENTER_PORT: 39270
      CONFIG_CENTER_INTERNAL_MTLS_PORT: 39272
      CONFIG_CENTER_MTLS_SERVER_CERT_PATH: /run/secrets/config_center_mtls_server_cert
      CONFIG_CENTER_MTLS_SERVER_KEY_PATH: /run/secrets/config_center_mtls_server_key
      CONFIG_CENTER_MTLS_CLIENT_CA_CERT_PATH: /run/secrets/config_center_mtls_ca
      MEMORY_ENGINE_MTLS_CA_CERT_PATH: /run/secrets/memory_engine_mtls_ca
      MEMORY_ENGINE_MTLS_CLIENT_IDENTITY_PATH: /run/secrets/memory_engine_mtls_client_identity
      CONFIG_CENTER_DATABASE_URL: postgresql://config_center_app:${CONFIG_CENTER_APP_PASSWORD:-${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}}@postgres:5432/configuration_center
      CONFIG_CENTER_POSTGRES_POOL_MAX_CONNECTIONS: ${CONFIG_CENTER_POSTGRES_POOL_MAX_CONNECTIONS:-10}
      CONFIG_CENTER_POSTGRES_POOL_MIN_CONNECTIONS: ${CONFIG_CENTER_POSTGRES_POOL_MIN_CONNECTIONS:-1}
      CONFIG_CENTER_POSTGRES_POOL_ACQUIRE_TIMEOUT_MS: ${CONFIG_CENTER_POSTGRES_POOL_ACQUIRE_TIMEOUT_MS:-5000}
      CONFIG_CENTER_POSTGRES_POOL_IDLE_TIMEOUT_MS: ${CONFIG_CENTER_POSTGRES_POOL_IDLE_TIMEOUT_MS:-600000}
      CONFIG_CENTER_POSTGRES_POOL_MAX_LIFETIME_MS: ${CONFIG_CENTER_POSTGRES_POOL_MAX_LIFETIME_MS:-1800000}
      CONFIG_CENTER_POSTGRES_STATEMENT_TIMEOUT_MS: ${CONFIG_CENTER_POSTGRES_STATEMENT_TIMEOUT_MS:-30000}
      CONFIG_CENTER_POSTGRES_LOCK_TIMEOUT_MS: ${CONFIG_CENTER_POSTGRES_LOCK_TIMEOUT_MS:-5000}
      CONFIG_CENTER_USER_SERVICE_BASE_URL: http://user-service-backend:39190
      CONFIGURATION_CENTER_MEMORY_ENGINE_BASE_URL: https://memory-engine-backend:7083/api/memory-engine/v1
      CONFIG_CENTER_LOCAL_CONNECTOR_SERVICE_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_LOCAL_CONNECTOR_SERVICE_CALLER_SIGNING_SECRET:-change_me_config_center_local_connector_signing_secret}
      CONFIG_CENTER_MEMORY_ENGINE_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_MEMORY_ENGINE_CALLER_SIGNING_SECRET:-change_me_config_center_memory_engine_signing_secret}
      CONFIG_CENTER_OFFICIAL_WEBSITE_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_OFFICIAL_WEBSITE_CALLER_SIGNING_SECRET:-change_me_config_center_official_website_signing_secret}
      CONFIG_CENTER_PLUGIN_MANAGEMENT_SERVICE_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_PLUGIN_MANAGEMENT_SERVICE_CALLER_SIGNING_SECRET:-change_me_config_center_plugin_management_signing_secret}
      CONFIG_CENTER_USER_SERVICE_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_USER_SERVICE_CALLER_SIGNING_SECRET:-change_me_config_center_user_service_signing_secret}
      CONFIG_CENTER_CONSUL_REQUIRED: ${CONFIG_CENTER_CONSUL_REQUIRED:-false}
      CONFIG_CENTER_CORS_ORIGINS: ${CONFIG_CENTER_CORS_ORIGINS:-http://127.0.0.1:39271,http://localhost:39271}
    ports:
      - "${CHATOS_PUBLIC_BIND_HOST:-127.0.0.1}:${CONFIG_CENTER_BACKEND_PORT:-39270}:39270"
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-finalize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:39270/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - cloud

  harness:
    image: ${HARNESS_IMAGE:-harness/harness:latest}
    restart: unless-stopped
    environment:
      GITNESS_HTTP_HOST: 0.0.0.0
      GITNESS_HTTP_PORT: 3000
      GITNESS_HTTP_PROTO: http
      GITNESS_URL_BASE: "${HARNESS_PUBLIC_BASE_URL:-http://localhost:3000}"
      GITNESS_URL_API: "${HARNESS_PUBLIC_BASE_URL:-http://localhost:3000}/api"
      GITNESS_URL_UI: "${HARNESS_PUBLIC_BASE_URL:-http://localhost:3000}"
      GITNESS_URL_INTERNAL: "http://harness:3000"
      GITNESS_URL_CONTAINER: "http://harness:3000"
      GITNESS_URL_GIT: "${HARNESS_GIT_BASE_URL:-http://localhost:3000/git}"
      GITNESS_URL_GIT_SSH: "ssh://git@${HARNESS_SSH_PUBLIC_HOST:-${HARNESS_SSH_HOST:-localhost}}:${HARNESS_SSH_PORT:-3022}"
      GITNESS_PRINCIPAL_ADMIN_EMAIL: ${HARNESS_ADMIN_EMAIL:-admin@chatos.local}
      GITNESS_PRINCIPAL_ADMIN_PASSWORD: ${HARNESS_ADMIN_PASSWORD:-admin123456}
      GITNESS_METRIC_ENABLED: "false"
      GITNESS_WEBHOOK_ALLOW_LOOPBACK: "true"
      GITNESS_SSH_ENABLE: "true"
      GITNESS_SSH_HOST: ${HARNESS_SSH_LISTEN_HOST:-0.0.0.0}
      GITNESS_SSH_PORT: 3022
      GITNESS_GITSPACE_ENABLE: "${HARNESS_GITSPACE_ENABLE:-true}"
      ENABLE_CI: "${HARNESS_CI_ENABLED:-true}"
      GITNESS_CI_PARALLEL_WORKERS: ${HARNESS_CI_PARALLEL_WORKERS:-2}
      GITNESS_CI_CONTAINER_NETWORKS: ${HARNESS_CI_CONTAINER_NETWORKS:-${CHATOS_DOCKER_NETWORK:-chatos-cloud}}
      GITNESS_DOCKER_HOST: "unix:///var/run/docker.sock"
      GITNESS_DATABASE_DRIVER: sqlite3
      GITNESS_DATABASE_DATASOURCE: /data/database.sqlite
      GITNESS_GIT_ROOT: /data
      GITNESS_REGISTRY_STORAGE_TYPE: filesystem
      GITNESS_REGISTRY_FILESYSTEM_ROOT_DIRECTORY: /data/registry
      XDG_CACHE_HOME: /data
    ports:
      - "${CHATOS_PUBLIC_BIND_HOST:-127.0.0.1}:${HARNESS_PORT:-3000}:3000"
      - "${CHATOS_PUBLIC_BIND_HOST:-127.0.0.1}:${HARNESS_SSH_PORT:-3022}:3022"
    volumes:
      - harness-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/api/v1/system/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        limits:
          cpus: "${HARNESS_CPU_LIMIT:-2.0}"
          memory: ${HARNESS_MEMORY_LIMIT:-2G}
