appId: com.chatos.local-connector
productName: Chat OS Local Connector
directories:
  output: ../dist/electron-macos
files:
  - dist/**/*
  - electron/*.cjs
  - package.json
asar: true
asarUnpack:
  - electron/core-runtime.cjs
extraResources:
  - from: ../.package/macos/local_connector_client_core
    to: local_connector_client_core
  - from: ../.package/macos/bundled-tools
    to: bundled-tools
  - from: ../.package/macos/sqlite-migrations
    to: sqlite-migrations
mac:
  category: public.app-category.developer-tools
  icon: ../.package/macos/ChatOS.icns
  hardenedRuntime: true
  entitlements: ../entitlements.mac.plist
  entitlementsInherit: ../entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: Chat OS Local Connector 仅在用户授权并安装相应 MCP 后控制明确授权的应用。
    NSDesktopFolderUsageDescription: Chat OS Local Connector 在任务权限允许时访问桌面目录，实际访问仍受 macOS 系统权限控制。
    NSDocumentsFolderUsageDescription: Chat OS Local Connector 在任务权限允许时访问文稿目录，实际访问仍受 macOS 系统权限控制。
    NSDownloadsFolderUsageDescription: Chat OS Local Connector 在任务权限允许时访问下载目录，实际访问仍受 macOS 系统权限控制。
    NSNetworkVolumesUsageDescription: Chat OS Local Connector 在任务权限允许时访问网络卷，实际访问仍受 macOS 系统权限控制。
    NSRemovableVolumesUsageDescription: Chat OS Local Connector 在任务权限允许时访问可移动卷，实际访问仍受 macOS 系统权限控制。
  target:
    - dmg
  artifactName: Chat-OS-Local-Connector-${version}-${arch}.${ext}
dmg:
  title: Chat OS Local Connector
