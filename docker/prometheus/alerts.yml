groups:
  - name: chatos-container-resources
    rules:
      - record: chatos_container_restarts_15m
        expr: clamp_min(count by (container_label_com_docker_compose_service, name) (count_over_time(container_start_time_seconds{job="cadvisor",container_label_com_docker_compose_project="chatos-rs",container_label_com_docker_compose_service!="",name!=""}[15m])) - 1, 0)

      - alert: ChatosContainerMetricsUnavailable
        expr: up{job="cadvisor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ChatOS container resource metrics are unavailable"
          description: "Prometheus has been unable to scrape cAdvisor for more than 2 minutes."

      - alert: ChatosContainerMemoryNearLimit
        expr: (container_memory_working_set_bytes{job="cadvisor",container_label_com_docker_compose_project="chatos-rs",container_label_com_docker_compose_service!=""} / container_spec_memory_limit_bytes{job="cadvisor",container_label_com_docker_compose_project="chatos-rs",container_label_com_docker_compose_service!=""}) > 0.9 and container_spec_memory_limit_bytes{job="cadvisor",container_label_com_docker_compose_project="chatos-rs",container_label_com_docker_compose_service!=""} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ChatOS container memory is near its limit"
          description: "{{ $labels.container_label_com_docker_compose_service }} has used more than 90% of its configured memory limit for 5 minutes."

      - alert: ChatosContainerOomDetected
        expr: increase(container_oom_events_total{job="cadvisor",container_label_com_docker_compose_project="chatos-rs",container_label_com_docker_compose_service!=""}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "ChatOS container OOM event detected"
          description: "{{ $labels.container_label_com_docker_compose_service }} recorded an OOM event within the last 5 minutes."

      - alert: ChatosContainerRestartDetected
        expr: chatos_container_restarts_15m > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "ChatOS container restart detected"
          description: "{{ $labels.container_label_com_docker_compose_service }} restarted {{ $value }} time(s) within the last 15 minutes."

  - name: chatos-memory-reliability
    rules:
      - alert: MemoryReliabilityAuditUnavailable
        expr: chatos_memory_reliability_audit_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Memory Engine reliability audit is unavailable"
          description: "The Memory Engine could not evaluate coverage, lineage, queue, and runtime readiness invariants."

      - alert: MemoryReliabilityInvariantBroken
        expr: sum by (kind) (chatos_memory_reliability_findings{severity="critical"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Memory Engine reliability invariant is broken"
          description: "Invariant {{ $labels.kind }} has {{ $value }} active finding(s). Follow the Memory Engine reliability runbook before resuming writes."

      - alert: MemoryReliabilityDeadLetterPresent
        expr: sum(chatos_memory_reliability_findings{kind=~"derived_event_dead_letter|partition_rebuild_failed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory Engine has failed durable work"
          description: "A derived event or partition rebuild remains failed. Repair the cause and use the audited Admin rearm operation."

      - alert: MemorySummaryDispatchDeadLettered
        expr: chatos_memory_reliability_backlog{kind="summary_dispatch_dead_lettered"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory summary dispatch is dead-lettered"
          description: "At least one project partition summary dispatch is dead-lettered."

      - alert: MemoryProviderOverflowOutputsIncreasing
        expr: delta(chatos_memory_reliability_backlog{kind="provider_overflow_outputs"}[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Memory generation provider overflow is increasing"
          description: "New outputs required provider overflow recovery during the last 30 minutes; verify frozen capability budgets and estimator revision."
