[package]
name = "chatos-windows-react"
version = "3.0.9"
description = "ChatOS Windows client"
authors = ["AI Chat Team"]
edition = "2021"

[workspace]

[lib]
name = "chatos_windows_react_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
chatos_ai_runtime = { path = "../../../crates/chatos_ai_runtime" }
chatos_local_agent_protocol = { path = "../../local_agent_host/layers/interface" }
chatos_plugin_management_sdk = { path = "../../../crates/chatos_plugin_management_sdk" }
memory_engine_sdk = { path = "../../../crates/memory_engine_sdk" }
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-global-shortcut = "2.3.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
rusqlite = { version = "0.38.0", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"
unicode-normalization = "0.1"
mime_guess = "2"
rfd = "0.15"
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
png = "0.18"
dirs = "6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
tempfile = "3"
portable-pty = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.1"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Threading"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
