[package]
name = "chatos_local_agent_host"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chatos_client_storage = { path = "../../crates/chatos_client_storage" }
chatos_local_agent_protocol = { path = "../../crates/chatos_local_agent_protocol" }
chatos_local_agent_runtime = { path = "../../crates/chatos_local_agent_runtime" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
] }
