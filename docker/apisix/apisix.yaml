routes:
  # Public aliases must never become a tunnel into service-only endpoints.
  - id: block-public-internal-api-aliases
    priority: 1000
    uris:
      - /api/chatos/internal/*
      - /api/user/internal/*
      - /api/project/internal/*
      - /api/plugin/internal/*
      - /api/mcp/internal/*
      - /api/mcp/api/internal/*
    plugins:
      request-id: &request_id
        header_name: X-Request-Id
        include_in_response: true
        algorithm: uuid
      fault-injection:
        abort:
          http_status: 404
          body: '{"error":"route not found"}'

  # Browser frontends are selected by their public hostname. Keeping these
  # routes above the generic /api aliases lets each frontend retain its own
  # same-origin API proxy while removing every frontend host-port mapping.
  - id: configuration-center-frontend
    priority: 700
    hosts:
      - config.jgoool.com
    uri: /*
    plugins:
      request-id: *request_id
    upstream:
      type: roundrobin
      nodes:
        "configuration-center-frontend:80": 1

  - id: user-service-frontend
    priority: 700
    hosts:
      - user.jgoool.com
    uri: /*
    plugins:
      request-id: *request_id
    upstream:
      type: roundrobin
      nodes:
        "user-service-frontend:80": 1

  - id: memory-engine-frontend
    priority: 700
    hosts:
      - memory.jgoool.com
    uri: /*
    plugins:
      request-id: *request_id
    upstream:
      type: roundrobin
      nodes:
        "memory-engine-frontend:80": 1

  - id: project-management-frontend
    priority: 700
    hosts:
      - project.jgoool.com
    uri: /*
    plugins:
      request-id: *request_id
    upstream:
      type: roundrobin
      nodes:
        "project-management-frontend:80": 1

  - id: plugin-management-frontend
    priority: 700
    hosts:
      - plugin.jgoool.com
    uri: /*
    plugins:
      request-id: *request_id
    upstream:
      type: roundrobin
      nodes:
        "plugin-management-frontend:80": 1

  - id: task-runner-frontend
    priority: 700
    hosts:
      - task.jgoool.com
    uri: /*
    plugins:
      request-id: *request_id
    upstream:
      type: roundrobin
      nodes:
        "task-runner-frontend:80": 1

  - id: official-website-frontend
    priority: 700
    hosts:
      - jgoool.com
      - www.jgoool.com
      - official.jgoool.com
    uri: /*
    plugins:
      request-id: *request_id
    upstream:
      type: roundrobin
      nodes:
        "official-website-frontend:80": 1

  # The native connector uses its historical public paths. Route the whole
  # dedicated hostname to the connector instead of exposing port 39230.
  - id: local-connector-public-host
    priority: 700
    hosts:
      - connector.jgoool.com
      - local-connector.jgoool.com
    uri: /*
    plugins:
      request-id: *request_id
      client-control:
        max_body_size: 134217728
    enable_websocket: true
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 600
        read: 3600
      nodes:
        "local-connector-service-backend:39230": 1

  # Keep the Plugin UI resource origin isolated while making APISIX the only
  # application listener used by the host Nginx reverse proxy.
  - id: plugin-ui-resource-host
    priority: 900
    hosts:
      - plugin-ui.jgoool.com
    uri: /api/plugin-ui/workbench/*
    methods:
      - GET
      - HEAD
    plugins:
      request-id: *request_id
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 30
        read: 30
      nodes:
        "chatos-backend:3997": 1

  - id: chatos-api-alias
    priority: 520
    uri: /api/chatos/*
    plugins:
      request-id: *request_id
      cors: &api_cors
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Request-Id,X-SSE-Ticket,X-Chatos-Client-Surface"
        expose_headers: "X-Request-Id,Content-Disposition"
        max_age: 3600
        allow_credential: false
      client-control: &api_body_limit
        max_body_size: 134217728
      limit-req: &api_ip_rate_limit
        rate: 60
        burst: 120
        rejected_code: 429
        rejected_msg: '{"error":"gateway rate limit exceeded"}'
        key_type: var
        key: remote_addr
      proxy-rewrite:
        regex_uri:
          - "^/api/chatos/?(.*)"
          - "/api/$1"
    enable_websocket: true
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 300
        read: 3600
      nodes:
        "chatos-backend:3997": 1

  - id: chatos-health
    priority: 600
    uri: /api/chatos/health
    plugins:
      request-id: *request_id
      cors: *api_cors
      limit-req: *api_ip_rate_limit
      proxy-rewrite:
        uri: /health
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 10
        read: 10
      nodes:
        "chatos-backend:3997": 1

  - id: user-service-api
    priority: 520
    uri: /api/user/*
    plugins:
      request-id: *request_id
      cors: *api_cors
      client-control: *api_body_limit
      limit-req: *api_ip_rate_limit
      proxy-rewrite:
        regex_uri:
          - "^/api/user/?(.*)"
          - "/api/$1"
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 120
        read: 120
      nodes:
        "user-service-backend:39190": 1

  - id: project-service-api
    priority: 520
    uri: /api/project/*
    plugins:
      request-id: *request_id
      cors: *api_cors
      client-control: *api_body_limit
      limit-req: *api_ip_rate_limit
      proxy-rewrite:
        regex_uri:
          - "^/api/project/?(.*)"
          - "/api/$1"
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 600
        read: 600
      nodes:
        "project-management-backend:39210": 1

  # Plugin catalog already owns the native /api/plugins namespace.
  - id: plugin-catalog-api
    priority: 540
    uri: /api/plugins/*
    plugins:
      request-id: *request_id
      cors: *api_cors
      client-control: *api_body_limit
      limit-req: *api_ip_rate_limit
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 300
        read: 600
      nodes:
        "plugin-management-backend:39260": 1

  # The broader alias exposes /api/mcps, /api/skills and admin plugin APIs.
  - id: plugin-management-api
    priority: 520
    uri: /api/plugin/*
    plugins:
      request-id: *request_id
      cors: *api_cors
      client-control: *api_body_limit
      limit-req: *api_ip_rate_limit
      proxy-rewrite:
        regex_uri:
          - "^/api/plugin/?(.*)"
          - "/api/$1"
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 300
        read: 600
      nodes:
        "plugin-management-backend:39260": 1

  - id: mcp-protocol-api
    priority: 560
    uri: /api/mcp
    plugins:
      request-id: *request_id
      cors: *api_cors
      client-control: *api_body_limit
      limit-req: *api_ip_rate_limit
      proxy-rewrite:
        uri: /mcp
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 600
        read: 3600
      nodes:
        "mcp-management-service-backend:39280": 1

  - id: local-connector-api
    priority: 520
    uri: /api/local/*
    plugins:
      request-id: *request_id
      cors: *api_cors
      client-control: *api_body_limit
      limit-req: *api_ip_rate_limit
      proxy-rewrite:
        regex_uri:
          - "^/api/local/?(.*)"
          - "/api/local-connectors/$1"
    enable_websocket: true
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 600
        read: 3600
      nodes:
        "local-connector-service-backend:39230": 1

  - id: task-runner-api
    priority: 520
    uri: /api/task/*
    plugins:
      request-id: *request_id
      cors: *api_cors
      client-control: *api_body_limit
      limit-req: *api_ip_rate_limit
      proxy-rewrite:
        regex_uri:
          - "^/api/task/?(.*)"
          - "/api/$1"
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 600
        read: 3600
      nodes:
        "task-runner-backend:39090": 1

  - id: memory-engine-api
    priority: 520
    uri: /api/memory/*
    plugins:
      request-id: *request_id
      cors: *api_cors
      client-control: *api_body_limit
      limit-req: *api_ip_rate_limit
      proxy-rewrite:
        regex_uri:
          - "^/api/memory/?(.*)"
          - "/api/memory-engine/v1/$1"
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 600
        read: 600
      nodes:
        "memory-engine-backend:7081": 1

  - id: block-unmatched-api-routes
    priority: 90
    uri: /api/*
    plugins:
      request-id: *request_id
      fault-injection:
        abort:
          http_status: 404
          body: '{"error":"route not found"}'

  - id: official-website-site
    priority: 50
    uri: /site/*
    plugins:
      request-id: *request_id
      proxy-rewrite:
        regex_uri:
          - "^/site/?(.*)"
          - "/$1"
    upstream:
      type: roundrobin
      nodes:
        "official-website-frontend:80": 1

  - id: official-website-root
    priority: 1
    uri: /*
    plugins:
      request-id: *request_id
    upstream:
      type: roundrobin
      nodes:
        "official-website-frontend:80": 1

#END
