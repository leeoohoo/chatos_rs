name: chatos-rs

x-rust-deploy: &rust-deploy
  resources:
    limits:
      cpus: "${CHATOS_RUST_CPU_LIMIT:-2.0}"
      memory: ${CHATOS_RUST_MEMORY_LIMIT:-1G}
    reservations:
      cpus: "${CHATOS_RUST_CPU_RESERVATION:-0.10}"
      memory: ${CHATOS_RUST_MEMORY_RESERVATION:-128M}

x-frontend-deploy: &frontend-deploy
  resources:
    limits:
      cpus: "${CHATOS_FRONTEND_CPU_LIMIT:-0.50}"
      memory: ${CHATOS_FRONTEND_MEMORY_LIMIT:-384M}
    reservations:
      cpus: "${CHATOS_FRONTEND_CPU_RESERVATION:-0.05}"
      memory: ${CHATOS_FRONTEND_MEMORY_RESERVATION:-64M}

x-config-center-mtls-server-secrets: &config-center-mtls-server-secrets
  - source: config_center_mtls_ca
    target: config_center_mtls_ca
  - source: config_center_mtls_server_cert
    target: config_center_mtls_server_cert
  - source: config_center_mtls_server_key
    target: config_center_mtls_server_key
  - source: memory_engine_mtls_ca
    target: memory_engine_mtls_ca
  - source: memory_engine_mtls_configuration_center_identity
    target: memory_engine_mtls_client_identity

x-config-center-mtls-local-connector-secrets: &config-center-mtls-local-connector-secrets
