version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/chatos/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      chat-app-npm:
        patterns:
          - "*"
        # Keep behavior-changing minor and major upgrades isolated so each
        # frontend migration can be reviewed and tested independently.
        update-types:
          - "patch"

  - package-ecosystem: "npm"
    directories:
      - "/local_connector_client/frontend"
      - "/memory_engine/frontend"
      - "/official_website_service/frontend"
      - "/plugin_management_service/frontend"
      - "/project_management_service/frontend"
      - "/task_runner_service/frontend"
      - "/user_service/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
    groups:
      service-frontends-npm:
        patterns:
          - "*"
        # A cross-service batch is only safe for patch releases. Electron,
        # Vite, jsdom, and UI framework minors need product-specific checks.
        update-types:
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      chat-app-server-rs-cargo:
        patterns:
          - "*"
        # Cargo 0.x minor bumps and normal major bumps can change APIs; keep
        # those out of the shared lockfile update batch.
        update-types:
          - "patch"

  - package-ecosystem: "cargo"
    directories:
      - "/memory_engine/backend"
      - "/user_service/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
    groups:
      standalone-services-cargo:
        patterns:
          - "*"
        # Queue, authentication, TLS, and server runtime migrations must be
        # evaluated separately instead of being hidden in one grouped PR.
        update-types:
          - "patch"
