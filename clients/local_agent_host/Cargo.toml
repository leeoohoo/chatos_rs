[package]
name = "chatos_local_agent_host"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chatos_client_storage = { path = "layers/infrastructure/database" }
chatos_agent_profiles = { path = "layers/profiles" }
chatos_local_agent_ports = { path = "layers/ports" }
chatos_local_agent_protocol = { path = "layers/interface" }
chatos_local_agent_runtime = { path = "layers/application" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
] }
