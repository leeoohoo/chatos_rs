[package]
name = "mcp_management_service_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.11"
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
chatos_agent = { path = "../../agent", default-features = false }
chatos_config_sdk = { path = "../../crates/chatos_config_sdk" }
chatos_mcp = { path = "../../mcp" }
chatos_mcp_management_sdk = { path = "../../crates/chatos_mcp_management_sdk" }
chatos_mcp_runtime = { path = "../../crates/chatos_mcp_runtime" }
chatos_mcp_service = { path = "../../crates/chatos_mcp_service" }
chatos_queue_observability = { path = "../../crates/chatos_queue_observability" }
chatos_plugin_management_sdk = { path = "../../crates/chatos_plugin_management_sdk" }
chatos_plugin_package = { path = "../../crates/chatos_plugin_package" }
chatos_service_runtime = { path = "../../crates/chatos_service_runtime", features = ["axum-support"] }
futures-util = "0.3"
hex = "0.4"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
lapin = { version = "2.5", features = ["rustls", "rustls-native-certs"] }
mongodb = { version = "2.8", features = ["tokio-runtime"] }
rand = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
redis = { version = "0.27", features = ["connection-manager", "tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
