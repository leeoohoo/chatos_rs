<title id="title">ChatOS 剧情模式 — 完整剧情分段操作台</title>
<desc id="desc">设计示例：完整剧情自动规划成八个连续的十五秒视频计划，总计两分钟。中间主区域展示所有分段及累计时间，右侧展开第三段详情。左侧管理完整原文和全剧共用素材，底部勾选批量生成。所有图片、模型和任务状态都是设计占位，不是实际生成结果。</desc>
