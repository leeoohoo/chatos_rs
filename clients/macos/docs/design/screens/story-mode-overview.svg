<text x="212" y="241"><tspan x="212">夏日午后，小禾沿田间小路</tspan><tspan x="212" dy="25">来到古树下，发现了一只受</tspan><tspan x="212" dy="25">伤的小鸟。她轻轻托起小鸟，</tspan><tspan x="212" dy="25">穿过草地，将它带到溪边。</tspan><tspan x="212" dy="34">经过细心照料，小鸟重新展</tspan><tspan x="212" dy="25">开翅膀，飞向夕阳。小禾挥</tspan><tspan x="212" dy="25">手道别，沿着来时的小路回</tspan><tspan x="212" dy="25">家，耳边响起清脆的鸟鸣。</tspan></text>
<text x="212" y="462" class="tiny muted">在这里粘贴整篇故事，不限一段。</text>
