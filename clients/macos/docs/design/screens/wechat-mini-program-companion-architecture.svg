<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">ChatOS 微信小程序控制端架构</title>
  <desc id="desc">微信小程序通过微信登录绑定 ChatOS 账号，再通过 HTTPS 和 WSS 查看设备、读取会话及发送消息。云端按会话保存的执行目标把本地工具调用路由到原桌面设备。小程序没有项目、Local Connector 或执行租约。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAF8"/>
      <stop offset="1" stop-color="#EEF3FA"/>
    </linearGradient>
    <linearGradient id="mini" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5F8ED"/>
      <stop offset="1" stop-color="#D9F2E4"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0EAFE"/>
      <stop offset="1" stop-color="#E7DDFC"/>
    </linearGradient>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F0FF"/>
      <stop offset="1" stop-color="#DCE8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#23314D" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#168A58"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#7C55C7"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#3B6FE8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1D2942; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5F6B82; }
      .section-title { font-size: 20px; font-weight: 700; }
      .node-title { font-size: 22px; font-weight: 700; }
      .node-subtitle { font-size: 14px; fill: #5F6B82; }
      .item { font-size: 15px; }
      .small { font-size: 13px; fill: #5F6B82; }
      .label { font-size: 13px; font-weight: 700; }
      .badge { font-size: 13px; font-weight: 700; }
      .flow-title { font-size: 14px; font-weight: 700; }
      .flow-text { font-size: 13px; fill: #5F6B82; }
    </style>
  </defs>

  <rect width="1440" height="1000" fill="url(#bg)"/>

  <text x="72" y="62" class="title">ChatOS 微信小程序控制端</text>
  <text x="72" y="92" class="subtitle">微信一键登录 · 设备监控 · 云端会话 · 桌面执行</text>

  <g transform="translate(1040 36)">
    <rect width="328" height="60" rx="30" fill="#FFFFFF" stroke="#C8D8CE"/>
    <circle cx="30" cy="30" r="10" fill="#168A58"/>
    <text x="52" y="36" class="badge" fill="#126D47">唯一移动端：微信小程序，只控制不执行</text>
  </g>

  <!-- WeChat identity platform -->
  <g transform="translate(512 118)">
    <rect width="416" height="78" rx="20" fill="#FFFFFF" stroke="#B9D8C5"/>
    <circle cx="38" cy="39" r="20" fill="#168A58"/>
    <circle cx="33" cy="36" r="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="44" cy="43" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="72" y="34" class="item" font-weight="700">微信身份平台</text>
    <text x="72" y="57" class="small">code → jscode2session → OpenID</text>
    <rect x="314" y="23" width="78" height="32" rx="16" fill="#E5F8ED"/>
    <text x="353" y="44" text-anchor="middle" class="badge" fill="#126D47">后端调用</text>
  </g>

  <!-- Mini Program -->
  <g transform="translate(72 242)" filter="url(#shadow)">
    <rect width="350" height="428" rx="28" fill="url(#mini)" stroke="#A7D9BD"/>
    <rect x="112" y="18" width="126" height="8" rx="4" fill="#9CCAB0"/>
    <circle cx="52" cy="70" r="22" fill="#168A58"/>
    <path d="M40 66c0-6 6-11 13-11 8 0 14 5 14 11 0 7-6 12-14 12-2 0-4 0-6-1l-6 3 2-6c-2-2-3-5-3-8Z" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="88" y="67" class="node-title">微信小程序</text>
    <text x="88" y="88" class="node-subtitle">原生 TypeScript · Companion Client</text>

    <g transform="translate(28 120)">
      <rect width="294" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
      <circle cx="25" cy="29" r="8" fill="#168A58"/>
      <text x="45" y="26" class="item" font-weight="700">微信登录与扫码绑定</text>
      <text x="45" y="46" class="small">wx.login · bind_ticket</text>
    </g>
    <g transform="translate(28 190)">
      <rect width="294" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
      <circle cx="25" cy="29" r="8" fill="#168A58"/>
      <text x="45" y="26" class="item" font-weight="700">设备监控</text>
      <text x="45" y="46" class="small">在线状态 · 最后在线 · 执行能力</text>
    </g>
    <g transform="translate(28 260)">
      <rect width="294" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
      <circle cx="25" cy="29" r="8" fill="#168A58"/>
      <text x="45" y="26" class="item" font-weight="700">云端会话控制</text>
      <text x="45" y="46" class="small">历史 · Send · Guidance · Stop</text>
    </g>
    <g transform="translate(28 336)">
      <rect width="92" height="34" rx="17" fill="#FFFFFF"/>
      <text x="46" y="22" text-anchor="middle" class="badge" fill="#168A58">wx.request</text>
      <rect x="101" width="110" height="34" rx="17" fill="#FFFFFF"/>
      <text x="156" y="22" text-anchor="middle" class="badge" fill="#168A58">connectSocket</text>
      <rect x="220" width="74" height="34" rx="17" fill="#FFFFFF"/>
      <text x="257" y="22" text-anchor="middle" class="badge" fill="#168A58">订阅消息</text>
    </g>
    <text x="175" y="405" text-anchor="middle" class="small">无项目 · 无 Connector · 无执行租约</text>
  </g>

  <!-- ChatOS Cloud -->
  <g transform="translate(545 242)" filter="url(#shadow)">
    <rect width="350" height="428" rx="28" fill="url(#cloud)" stroke="#CDBAEF"/>
    <circle cx="52" cy="70" r="22" fill="#7C55C7"/>
    <path d="M39 72c0-6 5-10 11-10 2-6 8-9 14-7 5 1 8 5 9 10 5 0 9 4 9 9 0 6-4 10-10 10H49c-6 0-10-5-10-12Z" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="88" y="67" class="node-title">ChatOS 云端</text>
    <text x="88" y="88" class="node-subtitle">账号、会话与执行编排</text>

    <g transform="translate(28 120)">
      <rect width="294" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
      <text x="20" y="26" class="item" font-weight="700">微信身份绑定</text>
      <text x="20" y="46" class="small">OpenID ↔ ChatOS user_id → JWT</text>
    </g>
    <g transform="translate(28 190)">
      <rect width="294" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
      <text x="20" y="26" class="item" font-weight="700">会话 / 消息 / Turn</text>
      <text x="20" y="46" class="small">列表 · 历史 · 状态 · Realtime</text>
    </g>
    <g transform="translate(28 260)">
      <rect width="294" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
      <text x="20" y="26" class="item" font-weight="700">Conversation Runtime</text>
      <text x="20" y="46" class="small">从 metadata 恢复原执行目标</text>
    </g>
    <g transform="translate(28 330)">
      <rect width="294" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
      <text x="20" y="26" class="item" font-weight="700">设备状态与执行路由</text>
      <text x="20" y="46" class="small">device_id + workspace_id</text>
    </g>
    <text x="175" y="405" text-anchor="middle" class="small">会话是唯一事实源</text>
  </g>

  <!-- Desktop -->
  <g transform="translate(1018 242)" filter="url(#shadow)">
    <rect width="350" height="428" rx="28" fill="url(#desktop)" stroke="#B8CBEF"/>
    <circle cx="52" cy="70" r="22" fill="#3B6FE8"/>
    <rect x="40" y="59" width="24" height="17" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M47 81h10M52 76v5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="88" y="67" class="node-title">桌面设备 A</text>
    <text x="88" y="88" class="node-subtitle">Execution Node / Local Connector</text>

    <g transform="translate(28 120)">
      <rect width="294" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
      <circle cx="25" cy="29" r="8" fill="#3B6FE8"/>
      <text x="45" y="26" class="item" font-weight="700">绑定入口</text>
      <text x="45" y="46" class="small">生成短期一次性小程序码</text>
    </g>
    <g transform="translate(28 190)">
      <rect width="294" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
      <circle cx="25" cy="29" r="8" fill="#3B6FE8"/>
      <text x="45" y="26" class="item" font-weight="700">项目与 Workspace</text>
      <text x="45" y="46" class="small">真实目录只存在于设备 A</text>
    </g>
    <g transform="translate(28 260)">
      <rect width="294" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
      <circle cx="25" cy="29" r="8" fill="#3B6FE8"/>
      <text x="45" y="26" class="item" font-weight="700">Local Connector</text>
      <text x="45" y="46" class="small">Relay · 心跳 · 活动租约</text>
    </g>
    <g transform="translate(28 330)">
      <rect width="294" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.88"/>
      <text x="20" y="26" class="item" font-weight="700">本地执行</text>
      <text x="20" y="46" class="small">文件 · 命令 · MCP · 插件</text>
    </g>
    <text x="175" y="405" text-anchor="middle" class="small">结果写回原云端会话</text>
  </g>

  <!-- WeChat identity arrows -->
  <path d="M512 158 C458 158 350 175 266 232" fill="none" stroke="#168A58" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-green)"/>
  <text x="348" y="169" class="label" fill="#168A58">wx.login code</text>
  <path d="M928 158 C968 158 791 194 720 232" fill="none" stroke="#7C55C7" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
  <text x="825" y="190" class="label" fill="#7C55C7">仅后端交换身份</text>

  <!-- Mini <-> Cloud -->
  <path d="M422 347 C468 347 498 347 535 347" fill="none" stroke="#168A58" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="434" y="306" width="91" height="27" rx="13.5" fill="#FFFFFF" stroke="#B9D8C5"/>
  <text x="480" y="324" text-anchor="middle" class="label" fill="#168A58">HTTPS / WSS</text>

  <path d="M535 468 C500 468 468 468 432 468" fill="none" stroke="#7C55C7" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <rect x="437" y="485" width="90" height="27" rx="13.5" fill="#FFFFFF" stroke="#D8C9F0"/>
  <text x="482" y="503" text-anchor="middle" class="label" fill="#7C55C7">事件 / 回复</text>

  <!-- Cloud <-> Desktop -->
  <path d="M895 347 C941 347 970 347 1008 347" fill="none" stroke="#7C55C7" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <rect x="907" y="306" width="92" height="27" rx="13.5" fill="#FFFFFF" stroke="#D8C9F0"/>
  <text x="953" y="324" text-anchor="middle" class="label" fill="#7C55C7">工具调用</text>

  <path d="M1008 468 C972 468 942 468 905 468" fill="none" stroke="#3B6FE8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="911" y="485" width="84" height="27" rx="13.5" fill="#FFFFFF" stroke="#C8D5ED"/>
  <text x="953" y="503" text-anchor="middle" class="label" fill="#3B6FE8">执行结果</text>

  <!-- Execution metadata -->
  <g transform="translate(498 696)">
    <rect width="444" height="62" rx="18" fill="#FFFFFF" stroke="#D2DAE8"/>
    <text x="222" y="25" text-anchor="middle" class="label" fill="#7C55C7">会话保存执行引用，不保存项目副本</text>
    <text x="222" y="47" text-anchor="middle" class="small">project_context.execution_target → device_id + workspace_id</text>
  </g>
  <path d="M720 670 L720 686" stroke="#7C55C7" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Login flow -->
  <g transform="translate(72 800)">
    <text x="0" y="0" class="section-title">微信绑定与后续登录</text>

    <g transform="translate(0 28)">
      <rect width="238" height="106" rx="18" fill="#FFFFFF" stroke="#D2DAE8"/>
      <circle cx="28" cy="28" r="15" fill="#3B6FE8"/>
      <text x="28" y="33" text-anchor="middle" class="badge" fill="#FFFFFF">1</text>
      <text x="52" y="33" class="flow-title">桌面生成绑定码</text>
      <text x="20" y="62" class="flow-text">5 分钟 · 一次性 bind_ticket</text>
      <text x="20" y="84" class="flow-text">绑定当前 ChatOS user_id</text>
    </g>

    <path d="M248 81H280" stroke="#7C55C7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

    <g transform="translate(290 28)">
      <rect width="238" height="106" rx="18" fill="#FFFFFF" stroke="#D2DAE8"/>
      <circle cx="28" cy="28" r="15" fill="#168A58"/>
      <text x="28" y="33" text-anchor="middle" class="badge" fill="#FFFFFF">2</text>
      <text x="52" y="33" class="flow-title">微信扫码并登录</text>
      <text x="20" y="62" class="flow-text">wx.login 获取一次性 code</text>
      <text x="20" y="84" class="flow-text">小程序提交 code + ticket</text>
    </g>

    <path d="M538 81H570" stroke="#7C55C7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

    <g transform="translate(580 28)">
      <rect width="238" height="106" rx="18" fill="#FFFFFF" stroke="#D2DAE8"/>
      <circle cx="28" cy="28" r="15" fill="#7C55C7"/>
      <text x="28" y="33" text-anchor="middle" class="badge" fill="#FFFFFF">3</text>
      <text x="52" y="33" class="flow-title">桌面确认并完成绑定</text>
      <text x="20" y="62" class="flow-text">当前桌面二次确认，防止抢绑</text>
      <text x="20" y="84" class="flow-text">OpenID ↔ user_id · 签发 Token</text>
    </g>

    <path d="M828 81H860" stroke="#7C55C7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

    <g transform="translate(870 28)">
      <rect width="426" height="106" rx="18" fill="#FFFFFF" stroke="#B9D8C5"/>
      <circle cx="28" cy="28" r="15" fill="#168A58"/>
      <text x="28" y="33" text-anchor="middle" class="badge" fill="#FFFFFF">✓</text>
      <text x="52" y="33" class="flow-title">以后微信一键登录</text>
      <text x="20" y="62" class="flow-text">重新 wx.login → 查找既有绑定 → 进入同一个 ChatOS 账号</text>
      <text x="20" y="84" class="flow-text">不会创建空账号，也不会影响桌面 Connector</text>
    </g>
  </g>

  <g transform="translate(72 972)">
    <text x="0" y="0" class="small">生产 V1 产品边界：不含原生 App · H5 · 项目同步 · 文件浏览 · 远程终端 · 小程序本地执行 · 离线自动补执行</text>
    <text x="1296" y="0" text-anchor="end" class="small">ChatOS WeChat Mini Program Companion</text>
  </g>
</svg>
