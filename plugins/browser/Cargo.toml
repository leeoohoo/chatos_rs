[workspace]
members = [
  "crates/browser-cdp-cli",
  "crates/browser-cdp-bridge",
  "crates/browser-cdp-core",
  "crates/browser-cdp-direct",
  "crates/browser-cdp-extension",
  "crates/browser-cdp-mcp",
  "crates/browser-cdp-policy",
  "crates/browser-cdp-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.11"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/chatos-ai/chatos-browser-cdp"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
async-tungstenite = { version = "0.32", features = ["tokio-runtime"] }
base64 = "0.22"
chromiumoxide = "0.9.1"
chromiumoxide_types = "0.9.1"
chrono = "0.4"
futures = "0.3"
fs2 = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
