      nodes:
        "official-website-frontend:80": 1

  # The native connector uses its historical public paths. Route the whole
  # dedicated hostname to the connector instead of exposing port 39230.
  - id: local-connector-public-host
    priority: 700
    hosts:
      - connector.jgoool.com
      - local-connector.jgoool.com
    uri: /*
    plugins:
      request-id: *request_id
      client-control:
        max_body_size: 134217728
    enable_websocket: true
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 600
        read: 3600
      nodes:
        "local-connector-service-backend:39230": 1

  # Keep the Plugin UI resource origin isolated while making APISIX the only
  # application listener used by the host Nginx reverse proxy.
  - id: plugin-ui-resource-host
    priority: 900
    hosts:
      - plugin-ui.jgoool.com
    uri: /api/plugin-ui/workbench/*
    methods:
      - GET
      - HEAD
    plugins:
      request-id: *request_id
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 30
        read: 30
      nodes:
        "chatos-backend:3997": 1

  - id: chatos-api-alias
    priority: 520
    uri: /api/chatos/*
    plugins:
      request-id: *request_id
      uri-blocker: *block_internal_api
      cors: &api_cors
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Request-Id,X-SSE-Ticket,X-Chatos-Client-Surface"
        expose_headers: "X-Request-Id,Content-Disposition"
        max_age: 3600
        allow_credential: false
      client-control: &api_body_limit
        max_body_size: 134217728
      limit-req: &api_ip_rate_limit
        rate: 60
        burst: 120
        rejected_code: 429
        rejected_msg: '{"error":"gateway rate limit exceeded"}'
        key_type: var
        key: remote_addr
      proxy-rewrite:
        regex_uri:
          - "^/api/chatos/?(.*)"
          - "/api/$1"
    enable_websocket: true
    upstream:
      type: roundrobin
      timeout:
        connect: 5
        send: 300
        read: 3600
      nodes:
        "chatos-backend:3997": 1

  - id: chatos-health
    priority: 600
