[package]
name = "chatos_memory_client"
version = "0.1.0"
edition = "2021"

[dependencies]
chatos_client_http = { path = "../chatos_client_http" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
