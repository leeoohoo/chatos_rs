name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Owned Source Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Test source-quality policies
        run: python3 -m unittest discover -s scripts/tests -p "test_code_quality_*.py"

      - name: Reject new oversized source and baseline growth
        env:
          CODE_QUALITY_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CODE_QUALITY_DIFF_HEAD: ${{ github.sha }}
        run: python3 scripts/check_source_size_policy.py --scope owned

      - name: Reject new production-code clones
        env:
          CODE_QUALITY_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CODE_QUALITY_DIFF_HEAD: ${{ github.sha }}
        run: python3 scripts/check_new_code_clones.py --min-lines 25

      - name: Reject hand-edited registry generated output
        run: node plugins/web-design-studio/scripts/registry-generated-integrity.mjs --check

  static-security:
    name: Secret and Container Config Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan repository secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          hide-progress: true
          skip-dirs: node_modules,target,target-shared

      - name: Reject high-risk container configuration findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          hide-progress: true
          skip-dirs: node_modules,target,target-shared

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust lockfiles
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' lockfile; do
            echo "Auditing $lockfile"
            cargo audit --file "$lockfile"
          done < <(find . -type d \( -name .git -o -name node_modules -o -name target -o -name target-shared \) -prune -o -type f -name Cargo.lock -print0 | sort -z)

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Audit production npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' lockfile; do
            dir="$(dirname "$lockfile")"
            echo "Auditing $dir"
            npm --prefix "$dir" audit --omit=dev --audit-level=high
          done < <(find . -type d \( -name .git -o -name node_modules -o -name target -o -name target-shared \) -prune -o -type f -name package-lock.json -print0 | sort -z)

  production-rust-services:
    name: Production Rust services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache production service builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target-shared
            memory_engine/backend -> target
            user_service/backend -> target

      - name: Check every production Rust service
        run: bash scripts/verify-repository.sh rust-build

  native-platform-contracts:
    name: Native platform (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: macos-arm64
            runner: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Select current Xcode toolchain
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          swift --version

      - name: Setup Rust for macOS Local Agent startup tests
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Verify native platform contracts
        shell: bash
        run: bash scripts/verify-repository.sh native-platform

      - name: Audit Computer Use Plugin Skill gates
        if: runner.os == 'macOS'
        run: npm --prefix plugins/computer-use run audit:skill-gates

      - name: Setup Node for native Document sandbox regression
        if: runner.os == 'macOS'
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/document/package-lock.json

      - name: Prepare Document renderer on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then
            brew install --cask google-chrome
          fi
          npm --prefix plugins/document ci
          npm --prefix plugins/document run vendor:fetch:current
          npm --prefix plugins/document run sbom:generate

      - name: Render an unpacked Document package inside the Native sandbox
        if: runner.os == 'macOS'
        run: bash clients/evals/native-document-sandbox-smoke.sh

  windows-react-client:
    name: Windows React client
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: clients/windows-react/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt

      - name: Cache Windows client builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target-shared

      - name: Install frontend dependencies
        run: npm --prefix clients/windows-react ci

      - name: Verify React application
        run: |
          npm --prefix clients/windows-react run audit:architecture
          npm --prefix clients/windows-react run typecheck
          npm --prefix clients/windows-react test
          npm --prefix clients/windows-react run build

      - name: Prepare Windows Local Agent Host resource
        env:
          TAURI_ENV_DEBUG: "true"
        run: npm --prefix clients/windows-react run prepare:sidecar

      - name: Assert sidecar resource exists
        shell: pwsh
        run: |
          $sidecar = "clients/windows-react/src-tauri/resources/chatos_local_agent_host.exe"
          if (-not (Test-Path $sidecar -PathType Leaf)) {
            throw "Missing Windows Local Agent Host resource: $sidecar"
          }

      - name: Verify Tauri Rust layer and real Host handshake
        env:
          CHATOS_LOCAL_AGENT_HOST_TEST_PATH: ${{ github.workspace }}\clients\windows-react\src-tauri\resources\chatos_local_agent_host.exe
        run: |
          cargo fmt --manifest-path clients/windows-react/src-tauri/Cargo.toml -- --check
          cargo test --manifest-path clients/windows-react/src-tauri/Cargo.toml
          cargo test --manifest-path clients/windows-react/src-tauri/Cargo.toml prepared_sidecar_ -- --ignored

      - name: Build Windows NSIS installer
        run: npm --prefix clients/windows-react run tauri -- build --bundles nsis

      - name: Assert Windows installer exists
        shell: pwsh
        run: |
          $installers = Get-ChildItem "target-shared/release/bundle/nsis/*.exe" -File
          if ($installers.Count -lt 1) {
            throw "Windows NSIS installer was not produced"
          }
          $installers | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: chatos-windows-installer-${{ github.sha }}
          path: target-shared/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  browser-plugin:
    name: Browser plugin (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy

      - name: Verify Browser plugin
        run: cargo +1.94.0 test --manifest-path plugins/browser/Cargo.toml --workspace --no-fail-fast

      - name: Build Browser plugin launcher
        run: cargo +1.94.0 build --manifest-path plugins/browser/Cargo.toml -p browser-cdp-cli

      - name: Audit Browser Plugin Skill gates
        run: node scripts/audit-plugin-skill-gates.mjs --manifest plugins/browser/npm/chatos.plugin.json --cwd plugins/browser -- ../../target-shared/debug/chatos-browser-cdp mcp

  document-plugin:
    name: Document plugin (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/document/package-lock.json

      - name: Install dependencies
        run: npm --prefix plugins/document ci

      - name: Fetch verified platform vendor tools
        run: npm --prefix plugins/document run vendor:fetch:current

      - name: Verify Document plugin
        run: npm --prefix plugins/document test

      - name: Audit Document Plugin Skill gates
        run: npm --prefix plugins/document run audit:skill-gates

  diagram-studio-plugin:
    name: Diagram Studio plugin (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/diagram-studio/package-lock.json

      - name: Install dependencies
        run: npm --prefix plugins/diagram-studio ci

      - name: Verify Diagram Studio plugin
        run: npm --prefix plugins/diagram-studio run pack:verify

  solution-studio-plugin:
    name: Solution Studio plugin (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/solution-studio/package-lock.json

      - name: Install dependencies
        run: npm --prefix plugins/solution-studio ci

      - name: Verify Solution Studio plugin
        run: npm --prefix plugins/solution-studio run pack:verify

  web-design-studio-plugin:
    name: Web Design Studio plugin (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/web-design-studio/package-lock.json

      - name: Install dependencies
        run: npm --prefix plugins/web-design-studio ci

      - name: Verify Web Design Studio plugin
        run: npm --prefix plugins/web-design-studio run pack:verify

  service-frontends:
    name: ${{ matrix.directory }} (TypeScript)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - admin_console
          - official_website_service/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: npm ci
        run: npm --prefix "${{ matrix.directory }}" ci

      - name: Verify frontend
        run: bash scripts/verify-repository.sh frontend "${{ matrix.directory }}"
