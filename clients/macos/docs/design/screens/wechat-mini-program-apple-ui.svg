    <linearGradient id="heroPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6657E8"/>
      <stop offset="1" stop-color="#9B8AFB"/>
    </linearGradient>
    <filter id="phoneShadow" x="-25%" y="-15%" width="150%" height="140%">
