[package]
name = "chatos_plugin_package"
version = "0.1.0"
edition = "2021"

[dependencies]
chatos_plugin_management_sdk = { path = "../chatos_plugin_management_sdk" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
