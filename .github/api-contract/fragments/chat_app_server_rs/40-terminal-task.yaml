paths:
  /api/terminals:
    get:
      summary: List terminals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: getApiTerminals
    post:
      summary: Create terminal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: postApiTerminals
  /api/terminals/dispatch-command:
    post:
      summary: Dispatch terminal command
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: postApiTerminalsDispatchCommand
  /api/terminals/{id}:
    get:
      summary: Get terminal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: getApiTerminalsById
    delete:
      summary: Delete terminal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: deleteApiTerminalsById
  /api/terminals/{id}/interrupt:
    post:
      summary: Interrupt terminal command
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: postApiTerminalsByIdInterrupt
  /api/terminals/{id}/history:
    get:
      summary: Get terminal history
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: getApiTerminalsByIdHistory
  /api/terminals/{id}/ws:
    get:
      summary: Terminal websocket
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '101':
          description: Switching Protocols
      operationId: getApiTerminalsByIdWs
  /api/task-manager/tasks:
    get:
      summary: List tasks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: getApiTaskManagerTasks
  /api/task-manager/tasks/{task_id}:
    patch:
      summary: Update task
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: patchApiTaskManagerTasksByTaskId
  /api/task-manager/tasks/{task_id}/events:
    get:
      summary: List task events
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: getApiTaskManagerTasksByTaskIdEvents
  /api/task-manager/tasks/{task_id}/complete:
    post:
      summary: Complete task
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: postApiTaskManagerTasksByTaskIdComplete
  /api/task-manager/reviews/{review_id}/decision:
    post:
      summary: Submit task review decision
      parameters:
      - in: path
        name: review_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: postApiTaskManagerReviewsByReviewIdDecision
  /api/pet-activities:
    get:
      summary: List persisted pet activities
      parameters:
      - in: query
        name: include_closed
        required: false
        schema:
          type: boolean
      - in: query
        name: mark_displayed
        required: false
        schema:
          type: boolean
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: getApiPetActivities
  /api/pet-activities/{activity_id}/displayed:
    post:
      summary: Mark pet activity displayed
      parameters:
      - in: path
        name: activity_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: postApiPetActivitiesByActivityIdDisplayed
  /api/pet-activities/{activity_id}/acknowledge:
    post:
      summary: Acknowledge pet activity
      parameters:
      - in: path
        name: activity_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: postApiPetActivitiesByActivityIdAcknowledge
  /api/pet-activities/{activity_id}/ignore:
    post:
      summary: Ignore pet activity version
      parameters:
      - in: path
        name: activity_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: postApiPetActivitiesByActivityIdIgnore
  /api/pet-activities/{activity_id}/handled:
    post:
      summary: Mark pet activity handled
      parameters:
      - in: path
        name: activity_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      operationId: postApiPetActivitiesByActivityIdHandled
