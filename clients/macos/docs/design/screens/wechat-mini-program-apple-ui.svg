      .board-title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
      .board-subtitle { font-size: 15px; fill: #6E7583; }
      .screen-label { font-size: 13px; font-weight: 600; fill: #6E7583; letter-spacing: 1.4px; }
      .status { font-size: 13px; font-weight: 600; }
      .large-title { font-size: 34px; font-weight: 700; letter-spacing: -1px; }
