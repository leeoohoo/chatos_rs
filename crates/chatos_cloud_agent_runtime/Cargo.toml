[package]
name = "chatos_cloud_agent_runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chatos_ai_runtime = { path = "../chatos_ai_runtime" }
chatos_cloud_agent_protocol = { path = "../chatos_cloud_agent_protocol" }
chatos_mcp_service = { path = "../chatos_mcp_service" }
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
lapin = { version = "2.5", features = ["rustls", "rustls-native-certs"] }
mongodb = { version = "2.8", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
