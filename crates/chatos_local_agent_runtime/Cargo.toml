[package]
name = "chatos_local_agent_runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chatos_client_storage = { path = "../chatos_client_storage" }
chatos_local_agent_protocol = { path = "../chatos_local_agent_protocol" }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
