[package]
name = "chatos_local_agent_runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chatos_local_agent_ports = { path = "../ports" }
chatos_local_agent_protocol = { path = "../interface" }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
chatos_client_storage = { path = "../infrastructure/database" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
