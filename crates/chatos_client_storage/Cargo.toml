[package]
name = "chatos_client_storage"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "postgres",
  "tls-native-tls",
] }
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
