x-rust-service: &rust-service
  restart: unless-stopped
  deploy: *rust-deploy
  depends_on:
    consul:
      condition: service_healthy
    mongodb:
      condition: service_healthy
    configuration-center-backend:
      condition: service_healthy
  networks:
    - cloud

x-service-runtime-env: &service-runtime-env
  CHATOS_SERVICE_RUNTIME_ENABLED: ${CHATOS_SERVICE_RUNTIME_ENABLED:-true}
  CHATOS_SERVICE_DISCOVERY_MODE: ${CHATOS_SERVICE_DISCOVERY_MODE:-consul,static}
  CHATOS_ENV: ${CHATOS_ENV:-local}
  CHATOS_CONSUL_HTTP_ADDR: ${CHATOS_CONSUL_HTTP_ADDR:-http://consul:8500}
  CHATOS_SERVICE_RUNTIME_REQUEST_TIMEOUT_MS: ${CHATOS_SERVICE_RUNTIME_REQUEST_TIMEOUT_MS:-3000}
  CONFIG_CENTER_BASE_URL: https://configuration-center-backend:39272
  CONFIG_CENTER_MTLS_CA_CERT_PATH: /run/secrets/config_center_mtls_ca
  PLUGIN_MANAGEMENT_MTLS_CA_CERT_PATH: /run/secrets/plugin_management_mtls_ca
  PLUGIN_MANAGEMENT_MTLS_CLIENT_IDENTITY_PATH: /run/secrets/plugin_management_mtls_client_identity
  CONFIG_CENTER_MTLS_CLIENT_IDENTITY_PATH: /run/secrets/config_center_mtls_client_identity
  CONFIG_CENTER_REQUEST_TIMEOUT_MS: ${CONFIG_CENTER_REQUEST_TIMEOUT_MS:-3000}
  CHATOS_AI_CONNECT_TIMEOUT_SECS: ${CHATOS_AI_CONNECT_TIMEOUT_SECS:-15}
  CHATOS_AI_READ_TIMEOUT_SECS: ${CHATOS_AI_READ_TIMEOUT_SECS:-7200}

x-frontend-service: &frontend-service
  restart: unless-stopped
  deploy: *frontend-deploy
  networks:
    - cloud

services:
  consul:
    image: ${CONSUL_IMAGE:-hashicorp/consul:1.21}
    restart: unless-stopped
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui", "-data-dir=/tmp/consul-data"]
    ports:
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${CONSUL_HTTP_PORT:-8500}:8500"
    volumes:
      - ./consul/services/harness.json:/consul/config/harness.json:ro
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "${CONSUL_CPU_LIMIT:-1.0}"
          memory: ${CONSUL_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${CONSUL_CPU_RESERVATION:-0.10}"
          memory: ${CONSUL_MEMORY_RESERVATION:-128M}
    networks:
      - cloud

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        umask 077
        printf '%s' "$${MONGODB_REPLICA_SET_KEY}" > /tmp/mongodb-keyfile
        chown mongodb:mongodb /tmp/mongodb-keyfile
        chmod 400 /tmp/mongodb-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongodb-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-admin}
      MONGODB_REPLICA_SET_KEY: ${MONGODB_REPLICA_SET_KEY:-Q2hhdE9TTG9jYWxEZXZSZXBsaWNhU2V0S2V5MjAyNg}
    ports:
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${MONGODB_HOST_PORT:-27018}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'try { rs.status().ok } catch (error) { if (error.code === 94) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]}).ok } else { throw error } }' | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "${MONGODB_CPU_LIMIT:-2.0}"
          memory: ${MONGODB_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${MONGODB_CPU_RESERVATION:-0.25}"
          memory: ${MONGODB_MEMORY_RESERVATION:-512M}
    networks:
      - cloud

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        minio server /data --console-address :9001 &
        server_pid=$$!
        trap 'kill -TERM "$$server_pid" 2>/dev/null || true; wait "$$server_pid"' TERM INT
        until mc alias set local http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
          sleep 1
        done
        mc mb --ignore-existing "local/$${CHATOS_OBJECT_STORAGE_BUCKET}" >/dev/null
        wait "$$server_pid"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chatos_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chatos_local_secret_change_me}
      CHATOS_OBJECT_STORAGE_BUCKET: ${CHATOS_OBJECT_STORAGE_BUCKET:-chatos-attachments}
    ports:
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-39000}:9000"
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-39001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "${MINIO_CPU_LIMIT:-1.0}"
          memory: ${MINIO_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${MINIO_CPU_RESERVATION:-0.05}"
          memory: ${MINIO_MEMORY_RESERVATION:-128M}
    networks:
      - cloud

  configuration-center-backend:
    restart: unless-stopped
    deploy: *rust-deploy
    image: ${CONFIG_CENTER_BACKEND_IMAGE:-${CHATOS_IMAGE_NAMESPACE:-ghcr.io/leeoohoo}/chatos-rs-configuration-center-backend:${CHATOS_IMAGE_TAG:-latest}}
    secrets: *config-center-mtls-server-secrets
    environment:
      <<: *service-runtime-env
      CHATOS_SERVICE_NAME: configuration-center
      CHATOS_SERVICE_ID: configuration-center-docker
      CHATOS_SERVICE_ADDRESS: configuration-center-backend
      CHATOS_SERVICE_PORT: 39270
      CHATOS_SERVICE_HEALTH_PATH: /health
      CONFIG_CENTER_HOST: 0.0.0.0
      CONFIG_CENTER_PORT: 39270
      CONFIG_CENTER_INTERNAL_MTLS_PORT: 39272
      CONFIG_CENTER_MTLS_SERVER_CERT_PATH: /run/secrets/config_center_mtls_server_cert
      CONFIG_CENTER_MTLS_SERVER_KEY_PATH: /run/secrets/config_center_mtls_server_key
      CONFIG_CENTER_MTLS_CLIENT_CA_CERT_PATH: /run/secrets/config_center_mtls_ca
      MEMORY_ENGINE_MTLS_CA_CERT_PATH: /run/secrets/memory_engine_mtls_ca
      MEMORY_ENGINE_MTLS_CLIENT_IDENTITY_PATH: /run/secrets/memory_engine_mtls_client_identity
      CONFIG_CENTER_DATABASE_URL: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-admin}@mongodb:27017/configuration_center?authSource=admin&replicaSet=rs0
      CONFIG_CENTER_MONGODB_DATABASE: configuration_center
      CONFIG_CENTER_USER_SERVICE_BASE_URL: http://user-service-backend:39190
      CONFIGURATION_CENTER_MEMORY_ENGINE_BASE_URL: https://memory-engine-backend:7083/api/memory-engine/v1
      CONFIG_CENTER_CHATOS_BACKEND_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_CHATOS_BACKEND_CALLER_SIGNING_SECRET:-change_me_config_center_chatos_backend_signing_secret}
      CONFIG_CENTER_MEMORY_ENGINE_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_MEMORY_ENGINE_CALLER_SIGNING_SECRET:-change_me_config_center_memory_engine_signing_secret}
      CONFIG_CENTER_OFFICIAL_WEBSITE_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_OFFICIAL_WEBSITE_CALLER_SIGNING_SECRET:-change_me_config_center_official_website_signing_secret}
      CONFIG_CENTER_PLUGIN_MANAGEMENT_SERVICE_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_PLUGIN_MANAGEMENT_SERVICE_CALLER_SIGNING_SECRET:-change_me_config_center_plugin_management_signing_secret}
      CONFIG_CENTER_USER_SERVICE_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_USER_SERVICE_CALLER_SIGNING_SECRET:-change_me_config_center_user_service_signing_secret}
      CONFIG_CENTER_CONSUL_REQUIRED: ${CONFIG_CENTER_CONSUL_REQUIRED:-false}
      CONFIG_CENTER_CORS_ORIGINS: ${CONFIG_CENTER_CORS_ORIGINS:-http://127.0.0.1:39271,http://localhost:39271}
    ports:
      - "${CHATOS_PUBLIC_BIND_HOST:-127.0.0.1}:${CONFIG_CENTER_BACKEND_PORT:-39270}:39270"
    depends_on:
      consul:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:39270/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - cloud

  harness:
    image: ${HARNESS_IMAGE:-harness/harness:latest}
    restart: unless-stopped
    environment:
      GITNESS_HTTP_HOST: 0.0.0.0
      GITNESS_HTTP_PORT: 3000
      GITNESS_HTTP_PROTO: http
      GITNESS_URL_BASE: "${HARNESS_PUBLIC_BASE_URL:-http://localhost:3000}"
      GITNESS_URL_API: "${HARNESS_PUBLIC_BASE_URL:-http://localhost:3000}/api"
      GITNESS_URL_UI: "${HARNESS_PUBLIC_BASE_URL:-http://localhost:3000}"
      GITNESS_URL_INTERNAL: "http://harness:3000"
      GITNESS_URL_CONTAINER: "http://harness:3000"
      GITNESS_URL_GIT: "${HARNESS_GIT_BASE_URL:-http://localhost:3000/git}"
      GITNESS_URL_GIT_SSH: "ssh://git@${HARNESS_SSH_PUBLIC_HOST:-${HARNESS_SSH_HOST:-localhost}}:${HARNESS_SSH_PORT:-3022}"
      GITNESS_PRINCIPAL_ADMIN_EMAIL: ${HARNESS_ADMIN_EMAIL:-admin@chatos.local}
      GITNESS_PRINCIPAL_ADMIN_PASSWORD: ${HARNESS_ADMIN_PASSWORD:-admin123456}
      GITNESS_METRIC_ENABLED: "false"
      GITNESS_WEBHOOK_ALLOW_LOOPBACK: "true"
      GITNESS_SSH_ENABLE: "true"
      GITNESS_SSH_HOST: ${HARNESS_SSH_LISTEN_HOST:-0.0.0.0}
      GITNESS_SSH_PORT: 3022
      GITNESS_GITSPACE_ENABLE: "${HARNESS_GITSPACE_ENABLE:-true}"
      ENABLE_CI: "${HARNESS_CI_ENABLED:-true}"
      GITNESS_CI_PARALLEL_WORKERS: ${HARNESS_CI_PARALLEL_WORKERS:-2}
      GITNESS_CI_CONTAINER_NETWORKS: ${HARNESS_CI_CONTAINER_NETWORKS:-${CHATOS_DOCKER_NETWORK:-chatos-cloud}}
      GITNESS_DOCKER_HOST: "unix:///var/run/docker.sock"
      GITNESS_DATABASE_DRIVER: sqlite3
      GITNESS_DATABASE_DATASOURCE: /data/database.sqlite
      GITNESS_GIT_ROOT: /data
      GITNESS_REGISTRY_STORAGE_TYPE: filesystem
      GITNESS_REGISTRY_FILESYSTEM_ROOT_DIRECTORY: /data/registry
      XDG_CACHE_HOME: /data
    ports:
      - "${CHATOS_PUBLIC_BIND_HOST:-127.0.0.1}:${HARNESS_PORT:-3000}:3000"
      - "${CHATOS_PUBLIC_BIND_HOST:-127.0.0.1}:${HARNESS_SSH_PORT:-3022}:3022"
    volumes:
      - harness-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/api/v1/system/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        limits:
          cpus: "${HARNESS_CPU_LIMIT:-2.0}"
          memory: ${HARNESS_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "${HARNESS_CPU_RESERVATION:-0.25}"
          memory: ${HARNESS_MEMORY_RESERVATION:-256M}
    networks:
      - cloud

  user-service-backend:
    <<: *rust-service
    image: ${USER_SERVICE_BACKEND_IMAGE:-${CHATOS_IMAGE_NAMESPACE:-ghcr.io/leeoohoo}/chatos-rs-user-service-backend:${CHATOS_IMAGE_TAG:-latest}}
    secrets: *config-center-mtls-user-service-secrets
    environment:
      <<: *service-runtime-env
      CHATOS_SERVICE_NAME: user-service
      CONFIG_CENTER_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_USER_SERVICE_CALLER_SIGNING_SECRET:-change_me_config_center_user_service_signing_secret}
      CHATOS_SERVICE_ID: user-service-docker
      CHATOS_SERVICE_ADDRESS: user-service-backend
      CHATOS_SERVICE_PORT: 39190
      CHATOS_SERVICE_HEALTH_PATH: /api/health
      USER_SERVICE_HOST: 0.0.0.0
      USER_SERVICE_PORT: 39190
      USER_SERVICE_INTERNAL_MTLS_PORT: 39192
      USER_SERVICE_MTLS_SERVER_CERT_PATH: /run/secrets/user_service_mtls_server_cert
      USER_SERVICE_MTLS_SERVER_KEY_PATH: /run/secrets/user_service_mtls_server_key
      USER_SERVICE_MTLS_CLIENT_CA_CERT_PATH: /run/secrets/user_service_mtls_ca
      USER_SERVICE_DATABASE_URL: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-admin}@mongodb:27017/user_service?authSource=admin&replicaSet=rs0
      USER_SERVICE_MONGODB_DATABASE: user_service
      USER_SERVICE_JWT_SECRET: ${USER_SERVICE_JWT_SECRET:-change_me_user_service_secret}
      USER_SERVICE_JWT_ISSUER: ${USER_SERVICE_JWT_ISSUER:-user_service}
      USER_SERVICE_USER_AUDIENCE: ${USER_SERVICE_USER_AUDIENCE:-user_service}
      CHATOS_USER_SERVICE_INTERNAL_API_SECRET: ${CHATOS_USER_SERVICE_INTERNAL_API_SECRET:-change_me_chatos_user_service_secret}
      USER_SERVICE_SMTP_HOST: ${USER_SERVICE_SMTP_HOST:-}
      USER_SERVICE_SMTP_PORT: ${USER_SERVICE_SMTP_PORT:-587}
      USER_SERVICE_SMTP_USERNAME: ${USER_SERVICE_SMTP_USERNAME:-}
      USER_SERVICE_SMTP_PASSWORD: ${USER_SERVICE_SMTP_PASSWORD:-}
      USER_SERVICE_EMAIL_FROM: ${USER_SERVICE_EMAIL_FROM:-}
      USER_SERVICE_EMAIL_FROM_NAME: ${USER_SERVICE_EMAIL_FROM_NAME:-Chat OS}
      USER_SERVICE_REGISTER_CODE_TTL_SECONDS: ${USER_SERVICE_REGISTER_CODE_TTL_SECONDS:-600}
      USER_SERVICE_REGISTER_CODE_RESEND_SECONDS: ${USER_SERVICE_REGISTER_CODE_RESEND_SECONDS:-60}
      USER_SERVICE_REGISTER_CODE_HOURLY_LIMIT: ${USER_SERVICE_REGISTER_CODE_HOURLY_LIMIT:-5}
      USER_SERVICE_REGISTER_CODE_MAX_ATTEMPTS: ${USER_SERVICE_REGISTER_CODE_MAX_ATTEMPTS:-5}
      USER_SERVICE_LOGIN_MAX_FAILED_ATTEMPTS: ${USER_SERVICE_LOGIN_MAX_FAILED_ATTEMPTS:-5}
      USER_SERVICE_LOGIN_FAILURE_WINDOW_SECONDS: ${USER_SERVICE_LOGIN_FAILURE_WINDOW_SECONDS:-300}
      USER_SERVICE_LOGIN_LOCKOUT_SECONDS: ${USER_SERVICE_LOGIN_LOCKOUT_SECONDS:-300}
      USER_SERVICE_SUPER_ADMIN_USERNAME: ${CHATOS_ADMIN_USERNAME:-admin}
      USER_SERVICE_SUPER_ADMIN_PASSWORD: ${CHATOS_ADMIN_PASSWORD:-admin123456}
      USER_SERVICE_SUPER_ADMIN_DISPLAY_NAME: ${CHATOS_ADMIN_DISPLAY_NAME:-System Admin}
      USER_SERVICE_MEMORY_ENGINE_INTERNAL_API_SECRET: ${USER_SERVICE_MEMORY_ENGINE_INTERNAL_API_SECRET:-change_me_user_service_memory_engine_secret}
      HARNESS_PROVISIONING_ENABLED: ${HARNESS_PROVISIONING_ENABLED:-true}
      HARNESS_BASE_URL: ${HARNESS_BASE_URL:-http://harness:3000}
      HARNESS_SYNTHETIC_EMAIL_DOMAIN: ${HARNESS_SYNTHETIC_EMAIL_DOMAIN:-chatos.local}
      HARNESS_SPACE_PREFIX: ${HARNESS_SPACE_PREFIX:-u-}
      HARNESS_PROJECT_PAT_PREFIX: ${HARNESS_PROJECT_PAT_PREFIX:-chatos-project}
    ports:
      - "${CHATOS_PUBLIC_BIND_HOST:-127.0.0.1}:${USER_SERVICE_PORT:-39190}:39190"
    depends_on:
      consul:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      configuration-center-backend:
        condition: service_healthy
      harness:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:39190/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  memory-engine-backend:
    <<: *rust-service
    deploy:
      resources:
        limits:
          cpus: "${MEMORY_ENGINE_API_CPU_LIMIT:-2.0}"
          memory: ${MEMORY_ENGINE_API_MEMORY_LIMIT:-1536M}
        reservations:
          cpus: "${MEMORY_ENGINE_API_CPU_RESERVATION:-0.10}"
          memory: ${MEMORY_ENGINE_API_MEMORY_RESERVATION:-256M}
    image: ${MEMORY_ENGINE_BACKEND_IMAGE:-${CHATOS_IMAGE_NAMESPACE:-ghcr.io/leeoohoo}/chatos-rs-memory-engine-backend:${CHATOS_IMAGE_TAG:-latest}}
    secrets: *config-center-mtls-memory-engine-api-secrets
    environment:
      <<: *service-runtime-env
      CHATOS_SERVICE_NAME: memory-engine
      CONFIG_CENTER_CALLER_SIGNING_SECRET: ${CONFIG_CENTER_MEMORY_ENGINE_CALLER_SIGNING_SECRET:-change_me_config_center_memory_engine_signing_secret}
      CHATOS_SERVICE_ID: memory-engine-docker
      CHATOS_SERVICE_ADDRESS: memory-engine-backend
      CHATOS_SERVICE_PORT: 7081
      CHATOS_SERVICE_HEALTH_PATH: /health
      MEMORY_ENGINE_HOST: 0.0.0.0
      MEMORY_ENGINE_PORT: 7081
      MEMORY_ENGINE_API_ENABLED: "true"
      MEMORY_ENGINE_WORKER_ENABLED: "false"
      MEMORY_ENGINE_MTLS_SERVER_CERT_PATH: /run/secrets/memory_engine_mtls_server_cert
      MEMORY_ENGINE_MTLS_SERVER_KEY_PATH: /run/secrets/memory_engine_mtls_server_key
      MEMORY_ENGINE_MTLS_CLIENT_CA_CERT_PATH: /run/secrets/memory_engine_mtls_ca
      MEMORY_ENGINE_MONGODB_URI: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-admin}@mongodb:27017/admin?replicaSet=rs0
      MEMORY_ENGINE_MONGODB_DATABASE: memory_engine
