map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name
        jgoool.com
        www.jgoool.com
        app.jgoool.com
        gateway.jgoool.com
        plugin-ui.jgoool.com
        user.jgoool.com
        memory.jgoool.com
        project.jgoool.com
        plugin.jgoool.com
        task.jgoool.com
        sandbox.jgoool.com
        official.jgoool.com
        connector.jgoool.com
        local-connector.jgoool.com
        harness.jgoool.com
        ci.jgoool.com;
    client_max_body_size 128m;

    include snippets/chatos-letsencrypt.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name jgoool.com www.jgoool.com;
    client_max_body_size 128m;
    include snippets/chatos-ssl.conf;

    location / {
        include snippets/chatos-proxy-headers.conf;
        proxy_pass http://127.0.0.1:39251;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.jgoool.com;
    client_max_body_size 128m;
    include snippets/chatos-ssl.conf;

    location ^~ /api/ {
        include snippets/chatos-proxy-headers.conf;
        proxy_pass http://127.0.0.1:9080;
    }

    location / {
        return 302 https://jgoool.com/#download;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gateway.jgoool.com;
    client_max_body_size 128m;
    include snippets/chatos-ssl.conf;

    location / {
        include snippets/chatos-proxy-headers.conf;
        proxy_pass http://127.0.0.1:9080;
    }
}

# CHATOS_PLUGIN_UI_RESOURCE_SERVER_BEGIN
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plugin-ui.jgoool.com;
    client_max_body_size 1m;
    include snippets/chatos-ssl.conf;

    location ^~ /api/plugin-ui/workbench/ {
        limit_except GET {
            deny all;
        }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:3997;
    }

    location / {
        return 404;
    }
}
# CHATOS_PLUGIN_UI_RESOURCE_SERVER_END

