[package]
name = "chatos_client_storage"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chatos_local_agent_ports = { path = "../../ports" }
chatos_local_agent_protocol = { path = "../../interface" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true, features = ["sqlite"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
