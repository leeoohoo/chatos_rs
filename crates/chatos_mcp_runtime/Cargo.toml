[package]
name = "chatos_mcp_runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chatos_service_runtime = { path = "../chatos_service_runtime" }
chatos_mcp_management_sdk = { path = "../chatos_mcp_management_sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate", "rustls-tls"] }
hex = "0.4"
futures-util = "0.3"
lapin = { version = "2.5", features = ["rustls", "rustls-native-certs"] }
sha2 = "0.11"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = { version = "0.8", features = ["json"] }
