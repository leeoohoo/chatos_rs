[package]
name = "chatos_local_agent_host"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
chatos_agent_profiles = { path = "../crates/chatos_agent_profiles" }
chatos_client_storage = { path = "../crates/chatos_client_storage" }
chatos_local_agent_protocol = { path = "../crates/chatos_local_agent_protocol" }
chatos_local_agent_runtime = { path = "../crates/chatos_local_agent_runtime" }
chatos_mcp_runtime = { path = "../crates/chatos_mcp_runtime" }
memory_engine_sdk = { path = "../crates/memory_engine_sdk" }
chrono = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
