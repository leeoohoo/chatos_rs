[package]
name = "postgres-user-migration"
version = "0.1.0"
edition = "2021"
publish = false

# Keep the temporary migration-only MongoDB dependency outside every runtime
# workspace. Delete this tool after the production cutover has been accepted.
[workspace]

[dependencies]
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
mongodb = "3.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "chrono",
  "json",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
