[package]
name = "chat_app_server_rs"
version = "0.1.0"
edition = "2021"
default-run = "chat_app_server_rs"

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "multipart", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "time", "json"] }
tracing-appender = "0.2"
tracing-opentelemetry = { version = "0.33", default-features = false }
tower-http = { version = "0.7", features = ["cors", "trace", "request-id"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "gzip", "brotli", "deflate", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
futures = "0.3"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
bytes = "1"
once_cell = "1"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["rt-tokio", "trace"] }
base64 = "0.22"
mime_guess = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
anyhow = "1"
tokio-util = "0.7"
parking_lot = "0.12"
url = "2"
urlencoding = "2"
zip = "8.6"
quick-xml = "0.41"
lopdf = "0.44"
sha2 = "0.11"
hex = "0.4"
walkdir = "2.4"
dirs = "6.0"
pathdiff = "0.2"
dashmap = "6.2"
regex = "1"
async-recursion = "1"
async-trait = "0.1"
libc = "0.2"
argon2 = "0.5"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.10"
aes-gcm = "0.11"
scraper = "0.27"

# Database
mongodb = { version = "2.8", features = ["tokio-runtime"] }
memory_engine_sdk = { path = "../../crates/memory_engine_sdk" }
chatos_agent = { path = "../../agent" }
chatos_ai_runtime = { path = "../../crates/chatos_ai_runtime" }
chatos_cloud_agent_protocol = { path = "../../crates/chatos_cloud_agent_protocol" }
chatos_cloud_agent_runtime = { path = "../../crates/chatos_cloud_agent_runtime" }
chatos_mcp = { path = "../../mcp" }
chatos_mcp_gateway = { path = "../../crates/chatos_mcp_gateway" }
chatos_mcp_management_sdk = { path = "../../crates/chatos_mcp_management_sdk" }
chatos_mcp_service = { path = "../../crates/chatos_mcp_service" }
chatos_mcp_runtime = { path = "../../crates/chatos_mcp_runtime" }
chatos_service_runtime = { path = "../../crates/chatos_service_runtime" }
chatos_config_sdk = { path = "../../crates/chatos_config_sdk" }
chatos_plugin_management_sdk = { path = "../../crates/chatos_plugin_management_sdk" }
chatos_project_execution = { path = "../../crates/chatos_project_execution" }

[features]
pdf = []
test-support = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
