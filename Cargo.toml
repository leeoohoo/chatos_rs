[workspace]
members = [
  "agent",
  "mcp",
  "chatos/backend",
  "crates/chatos_cloud_agent_protocol",
  "crates/chatos_cloud_agent_runtime",
  "crates/chatos_ai_runtime",
  "crates/chatos_internal_auth",
  "crates/chatos_remote_runtime",
  "crates/chatos_sandbox_contract",
  "crates/memory_engine_sdk",
  "crates/chatos_mcp_runtime",
  "crates/chatos_mcp_gateway",
  "crates/chatos_mcp_management_sdk",
  "crates/chatos_mcp_service",
  "crates/chatos_service_runtime",
  "crates/chatos_terminal_runtime",
  "crates/chatos_config_sdk",
  "crates/chatos_plugin_management_sdk",
  "crates/chatos_postgres",
  "crates/chatos_local_workspace",
  "crates/chatos_queue_observability",
  "config_center_service/backend",
  "task_runner_service/backend",
  "local_connector_service/backend",
  "mcp_management_service/backend",
  "plugin_management_service/backend",
  "official_website_service/backend",
]
exclude = [
  "memory_engine/backend"
]

resolver = "2"

[workspace.dependencies]
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "chrono",
  "json",
  "migrate",
  "macros",
] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
