      .body { font-size: 15px; }
      .callout { font-size: 14px; font-weight: 600; }
      .caption { font-size: 12px; fill: #8E8E93; }
      .caption-dark { font-size: 12px; fill: #5F6672; }
      .tab { font-size: 10px; font-weight: 500; fill: #8E8E93; }
      .tab-active { font-size: 10px; font-weight: 600; fill: #007AFF; }
      .white-title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
      .white-body { font-size: 13px; fill: #FFFFFF; fill-opacity: 0.86; }
      .token-title { font-size: 13px; font-weight: 600; }
      .token-text { font-size: 12px; fill: #6E7583; }
    </style>
