services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management-alpine}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-chatos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change_me_rabbitmq_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "${RABBITMQ_CPU_LIMIT:-1.0}"
          memory: ${RABBITMQ_MEMORY_LIMIT:-1G}
        reservations:
          cpus: "${RABBITMQ_CPU_RESERVATION:-0.10}"
          memory: ${RABBITMQ_MEMORY_RESERVATION:-256M}
    networks:
      - cloud

  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:8-alpine}
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec valkey-server --appendonly yes --requirepass "$${VALKEY_PASSWORD}"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-change_me_valkey_password}
    ports:
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${VALKEY_PASSWORD}\" valkey-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "${VALKEY_CPU_LIMIT:-1.0}"
          memory: ${VALKEY_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${VALKEY_CPU_RESERVATION:-0.05}"
          memory: ${VALKEY_MEMORY_RESERVATION:-64M}
    networks:
      - cloud

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1}
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --max_housekeeping_interval=30s
      - --enable_metrics=cpu,memory,oom_event
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - ${CADVISOR_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "${CADVISOR_CPU_LIMIT:-0.50}"
          memory: ${CADVISOR_MEMORY_LIMIT:-256M}
        reservations:
          cpus: "${CADVISOR_CPU_RESERVATION:-0.05}"
          memory: ${CADVISOR_MEMORY_RESERVATION:-64M}
    networks:
      - cloud

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    ports:
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      cadvisor:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-1.0}"
          memory: ${PROMETHEUS_MEMORY_LIMIT:-1G}
        reservations:
          cpus: "${PROMETHEUS_CPU_RESERVATION:-0.10}"
          memory: ${PROMETHEUS_MEMORY_RESERVATION:-128M}
    networks:
      - cloud

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.27.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    deploy:
      resources:
        limits:
          cpus: "${ALERTMANAGER_CPU_LIMIT:-0.50}"
          memory: ${ALERTMANAGER_MEMORY_LIMIT:-256M}
        reservations:
          cpus: "${ALERTMANAGER_CPU_RESERVATION:-0.05}"
          memory: ${ALERTMANAGER_MEMORY_RESERVATION:-64M}
    networks:
      - cloud

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    ports:
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-1.0}"
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${GRAFANA_CPU_RESERVATION:-0.05}"
          memory: ${GRAFANA_MEMORY_RESERVATION:-128M}
    networks:
      - cloud

  apisix-gateway:
    image: ${APISIX_IMAGE:-apache/apisix:3.11.0-debian}
    restart: unless-stopped
    ports:
      - "${CHATOS_PUBLIC_BIND_HOST:-127.0.0.1}:${APISIX_GATEWAY_PORT:-9080}:9080"
      - "${CHATOS_INFRA_BIND_HOST:-127.0.0.1}:${APISIX_CONTROL_PORT:-9092}:9092"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    deploy:
      resources:
        limits:
          cpus: "${APISIX_CPU_LIMIT:-1.0}"
          memory: ${APISIX_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${APISIX_CPU_RESERVATION:-0.10}"
          memory: ${APISIX_MEMORY_RESERVATION:-128M}
    networks:
      - cloud

  local-connector-service-backend:
    environment:
      LOCAL_CONNECTOR_REQUIRE_SIGNED_INTERNAL_REQUESTS: ${LOCAL_CONNECTOR_REQUIRE_SIGNED_INTERNAL_REQUESTS:-true}

  project-management-backend:
    environment:
      PROJECT_SERVICE_REQUIRE_SIGNED_INTERNAL_REQUESTS: ${PROJECT_SERVICE_REQUIRE_SIGNED_INTERNAL_REQUESTS:-true}

  memory-engine-backend:
    environment:
      MEMORY_ENGINE_REQUIRE_SIGNED_INTERNAL_REQUESTS: ${MEMORY_ENGINE_REQUIRE_SIGNED_INTERNAL_REQUESTS:-true}

  mcp-management-service-backend:
    environment:
      MCP_MANAGEMENT_REQUIRE_SIGNED_INTERNAL_REQUESTS: ${MCP_MANAGEMENT_REQUIRE_SIGNED_INTERNAL_REQUESTS:-true}
      MCP_MANAGEMENT_ALLOWED_INTERNAL_CALLERS: ${MCP_MANAGEMENT_ALLOWED_INTERNAL_CALLERS:-chatos,task-runner,project-service,configuration-center}

  task-runner-backend:
    environment:
      TASK_RUNNER_RABBITMQ_URL: ${TASK_RUNNER_RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-chatos}:${RABBITMQ_DEFAULT_PASS:-change_me_rabbitmq_password}@rabbitmq:5672/${RABBITMQ_AMQP_VHOST:-%2f}}
      TASK_RUNNER_RUN_DISPATCH_MODE: ${TASK_RUNNER_RUN_DISPATCH_MODE:-rabbitmq}
      TASK_RUNNER_CALLBACK_DELIVERY_MODE: ${TASK_RUNNER_CALLBACK_DELIVERY_MODE:-rabbitmq}
      TASK_RUNNER_RABBITMQ_EXCHANGE: ${TASK_RUNNER_RABBITMQ_EXCHANGE:-task_runner}
      TASK_RUNNER_RUN_DISPATCH_QUEUE: ${TASK_RUNNER_RUN_DISPATCH_QUEUE:-task_runner.run.dispatch}
      TASK_RUNNER_CALLBACK_DELIVERY_QUEUE: ${TASK_RUNNER_CALLBACK_DELIVERY_QUEUE:-task_runner.callback.delivery}

  task-runner-worker:
    environment:
      TASK_RUNNER_RABBITMQ_URL: ${TASK_RUNNER_RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-chatos}:${RABBITMQ_DEFAULT_PASS:-change_me_rabbitmq_password}@rabbitmq:5672/${RABBITMQ_AMQP_VHOST:-%2f}}
      TASK_RUNNER_RUN_DISPATCH_MODE: ${TASK_RUNNER_RUN_DISPATCH_MODE:-rabbitmq}
      TASK_RUNNER_CALLBACK_DELIVERY_MODE: ${TASK_RUNNER_CALLBACK_DELIVERY_MODE:-rabbitmq}
      TASK_RUNNER_RABBITMQ_EXCHANGE: ${TASK_RUNNER_RABBITMQ_EXCHANGE:-task_runner}
      TASK_RUNNER_RUN_DISPATCH_QUEUE: ${TASK_RUNNER_RUN_DISPATCH_QUEUE:-task_runner.run.dispatch}
      TASK_RUNNER_CALLBACK_DELIVERY_QUEUE: ${TASK_RUNNER_CALLBACK_DELIVERY_QUEUE:-task_runner.callback.delivery}

  task-runner-scheduler:
    environment:
      TASK_RUNNER_RABBITMQ_URL: ${TASK_RUNNER_RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-chatos}:${RABBITMQ_DEFAULT_PASS:-change_me_rabbitmq_password}@rabbitmq:5672/${RABBITMQ_AMQP_VHOST:-%2f}}
      TASK_RUNNER_RUN_DISPATCH_MODE: ${TASK_RUNNER_RUN_DISPATCH_MODE:-rabbitmq}
      TASK_RUNNER_CALLBACK_DELIVERY_MODE: ${TASK_RUNNER_CALLBACK_DELIVERY_MODE:-rabbitmq}
      TASK_RUNNER_RABBITMQ_EXCHANGE: ${TASK_RUNNER_RABBITMQ_EXCHANGE:-task_runner}
      TASK_RUNNER_RUN_DISPATCH_QUEUE: ${TASK_RUNNER_RUN_DISPATCH_QUEUE:-task_runner.run.dispatch}
      TASK_RUNNER_CALLBACK_DELIVERY_QUEUE: ${TASK_RUNNER_CALLBACK_DELIVERY_QUEUE:-task_runner.callback.delivery}

volumes:
  rabbitmq-data:
  valkey-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
