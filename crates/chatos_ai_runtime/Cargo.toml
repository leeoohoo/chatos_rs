[package]
name = "chatos_ai_runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
chatos_service_runtime = { path = "../chatos_service_runtime" }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net"] }
