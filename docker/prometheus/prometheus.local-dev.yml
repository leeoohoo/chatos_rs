global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: memory-engine
    static_configs:
      - targets: ["host.docker.internal:7081"]

  - job_name: plugin-management-service
    static_configs:
      - targets: ["host.docker.internal:39260"]

  - job_name: user-service
    static_configs:
      - targets: ["host.docker.internal:39190"]

  - job_name: configuration-center
    static_configs:
      - targets: ["host.docker.internal:39270"]

  - job_name: local-connector
    static_configs:
      - targets: ["host.docker.internal:39230"]
