<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">ChatOS 微信小程序 Apple 风格界面设计</title>
  <desc id="desc">三个微信小程序页面设计：设备监控、会话列表和会话详情。采用苹果风格的大标题、分组卡片、系统蓝、轻量层级和宽松留白，同时保留微信小程序胶囊按钮。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="heroBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#147BFF"/>
      <stop offset="1" stop-color="#5AA7FF"/>
