[package]
name = "chatos_client_storage"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
