map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jgoool.com www.jgoool.com;
    client_max_body_size 128m;

    include snippets/chatos-letsencrypt.conf;

    location / {
        include snippets/chatos-proxy-headers.conf;
        proxy_pass http://127.0.0.1:9080;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.jgoool.com;
    client_max_body_size 128m;

    include snippets/chatos-letsencrypt.conf;

    location ^~ /api/ {
        include snippets/chatos-proxy-headers.conf;
        proxy_pass http://127.0.0.1:9080;
    }

    location / {
        return 302 https://jgoool.com/#download;
    }
}

